[project]
name = "docrender"
version = "0.1.0"
description = "Standalone markdown doc-site renderer. One app, many instances."
requires-python = ">=3.11"
dependencies = [
  "mkdocs-material>=9.7,<10",
  "PyYAML>=6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["docrender"]
