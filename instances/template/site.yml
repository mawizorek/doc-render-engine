# The gold-standard instance.
#
# This is a real site with a real build, and that is the entire idea: a written
# specification rots, an executable one cannot. If the template renders, the
# spec is true by demonstration. If a change to the engine breaks the contract,
# this site breaks first and loudest, before any site with readers.
#
# It is also the reference every other instance is copied from. Keep it
# ordinary: no clever exceptions, no special cases, nothing another site cannot
# imitate.

name: Doc Family Template
description: The executable gold standard for every doc site in this family.
slug: template

# ⭐ OTHER NAMES THIS SITE ANSWERS TO ON THE COMMAND LINE (added 2026-08-05).
# Contract + the reasoning for why these live in the repo: instances/uritp/site.yml.
#
# DELIBERATELY ORDINARY, per this file's own rule: the repo name and the display
# name, nothing clever. The gold standard has to DEMONSTRATE an optional key or
# the key is not really part of the spec -- an instance copied from here should
# find the block already present and obvious to edit.
#
# ⚠️ OPTIONAL, THOUGH. Omitting `aliases:` entirely is legal and reported as
# "none declared"; the slug always resolves on its own. So this does NOT become
# a fourth required edit when adding a site -- the three in publish.yml's header
# are still the three.
aliases: [template-docs, "Doc Family Template", gold-standard]

# ⚠️ THE ONE PLACE THIS INSTANCE IS NOT ORDINARY.
#
# Every real site lives at its own content repo's Pages URL. This one is served
# from the ENGINE's own Pages by publish-default.yml, so that the gold standard
# is live with no PAT -- which is the only way "the spec is proved by building"
# is true on day one rather than after somebody clicks things.
#
# So base_url is the ENGINE's address. It has to match where the site actually
# lands: it becomes the canonical site URL and every absolute link inside
# /doc-index.json, which is what sibling sites resolve their cross-site links
# against. A pretty-but-wrong base_url would hand every peer a set of 404s and
# nothing here would look broken.
base_url: https://mawizorek.github.io/doc-render-engine/

content_repo: mawizorek/template-docs
content_branch: main

theme: base

# Kept ON here even after the real sites turn it off. This site's readers are
# people editing the family, so the door back to the source is the point.
edit_links: true

palette:
  dark:
    primary: black
    accent: cyan
  light:
    primary: blue grey
    accent: cyan

# Fallback only: a folder with an index.md takes that page's title instead.
sections:
  authoring:
    order: 10
  venues:
    order: 20
  standards:
    order: 30
  reference:
    order: 40

peers: {}

# ⚠️ THE ONE INSTANCE THAT STILL OPTS OUT, and for a reason that does not
# apply to any other site: this slug is the literal word "template", which
# appears in engine CODE legitimately -- `instances/template` is the path the
# copy-a-new-site procedure names, and the word turns up in identifiers rather
# than only in prose. Scanning would fail on correct code, not on a leak.
#
# Every REAL site is under the scan. If a future instance needs this line,
# the honest question is whether its slug is too generic to be a slug.
leak_tokens: []
