# General theatre notes — practice that is not tied to one building, plus the
# venue records that are.
#
# Renamed from `oph` on 2026-08-03.

name: Theatre Notes
description: Professional theatre practice, venue records and reference.
slug: theatre
base_url: https://mawizorek.github.io/theatre-docs/

content_repo: mawizorek/theatre-docs
content_branch: main

# ⭐ ONE LINE, same as every other site. `database` treats a table as the
# primary content rather than an illustration of it, which is the right call
# for a site whose first real pages are 130-row circuit schedules.
theme: database

# 🔀 One quiet "Edit this page on GitHub" at the foot, and nothing else in the
# site mentions a repository. Set to `false` to remove even that -- the
# intended end state once these pages have outside readers.
edit_links: true

palette:
  dark:
    primary: black
    accent: teal
  light:
    primary: blue grey
    accent: teal

# Fallback only: a folder with an index.md takes that page's title instead.
sections:
  venues:
    order: 10
  practice:
    order: 20
  reference:
    order: 30

peers:
  template: https://mawizorek.github.io/doc-render-engine/

# ✅ LEAK SCAN BACK ON (2026-08-03). It was disabled because the word
# "theatre" appears legitimately in the engine's own object declarations, and
# scanning raw text would have failed every build on a correct file.
#
# The scan now reads CODE and ignores comments, so a word used in prose is no
# longer mistaken for a dependency. Two instances opted out under the old
# design and the third then blocked on a comment about the check itself, which
# is what forced the redesign. All three are back under it.
