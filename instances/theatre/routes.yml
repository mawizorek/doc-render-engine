# ROUTE TABLES for this site. See instances/uritp/routes.yml for the full
# explanation; the short version:
#
#   - a page opts in with `router: <table>` and renders a text field
#   - the value on the right is a page `id`, never a path
#   - NOT security. A router does not know where to send a wrong code; it does
#     not stop anyone reaching the destination another way.
#
# The table NAME is shared vocabulary across the family; the KEYS are local to
# this site. `crew` here and `crew` on another site are different codes for
# different people, which is correct.
