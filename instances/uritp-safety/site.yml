# THE LAST DOOR BACK TO THE SOURCE, DELIBERATELY SHUT (2026-08-16).
#
# `true` puts one quiet "Edit this page on GitHub" line at the foot of every
# page. On `uritp` it is scaffolding, and its own site.yml says the intended end
# state is `false` once the site goes out to designers, guest artists and
# students.
#
# THIS SITE IS THAT END STATE ON DAY ONE. Every reader here is one of those
# people, so the link is not scaffolding -- it is an affordance offered to
# somebody who cannot use it.
#
# AND THE REASON IS NOT LEAK RISK, which is worth stating so nobody "restores"
# it on the grounds that the repo is private. A private repo means the edit URL
# 404s for every reader who is not on it, so nothing is exposed either way. It
# is off because a link that looks like an invitation and delivers a 404 is a
# DEAD CONTROL, and this engine kills those on sight.
#
# WARNING: PRIVATE REPO IS NOT A PRIVATE SITE. The repo being private stops
# somebody swapping `github.io` for `github.com` and reading the source tree.
# It does nothing whatsoever to the PUBLISHED site, which Pages serves from
# `gh-pages` to anybody with the URL. Nothing in this content tree should be
# written on the assumption that only URITP people can read it.
edit_links: false

# NO `sections:` BLOCK, and its absence is deliberate.
#
# That block exists to ORDER folders and to TITLE the ones with no index page.
# Every folder here has an index that declares its own `order:` (policies 10,
# programs 20, privileges-hazards 30) and its own `title:`, and the engine reads
# the index first -- config only covers what the content cannot speak for.
#
# A `sections:` entry here would restate a fact the content already states, or
# worse, name a folder that does not exist. `uritp`'s block carries a
# `reference:` row for a folder absent from its tree, which is exactly the
# config-key-that-does-nothing this engine keeps writing down.

# NO `peers:` BLOCK, and this one is a judgement rather than a technicality.
#
# `uritp` is the obvious candidate and is deliberately not listed. Cross-site
# links resolve through a peer's published page index, so declaring it would let
# a page here point at the WORKSHOP tree -- sending a reader who came for the
# adopted standard into the draft it was filtered out of. That is the one
# direction this repo exists to prevent.
#
# A safety page needing something from `uritp-docs` is a signal that the thing
# has not been filtered yet, not a signal that it needs a link.

# NO `routes.yml` in this folder, and the engine is fine with that: `_uses_router`
# reads the file if it exists and answers False when it does not, so neither
# `router.css` nor `router.js` is even published to a site with no routers.
#
# There should never be one here. A router is a curtain, it protects nothing,
# and the content it would withhold is the content everybody is meant to have
# read. Anything on this site that cannot be shown to everyone does not belong
# on this site.
