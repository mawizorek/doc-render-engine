# =============================================================================
# ⭐ THE PRINTED LETTERHEAD (2026-08-29)
# =============================================================================
# > Michael: *"when printing a page from the doc render (uritp-safety) i want to
# > render logo-horizontal in the header at the left."*
#
# The mark that prints at the top-left of sheet one, beside the site name and
# the period. `docrender/buildstamp.py` resolves it; `assets/print-identity.css`
# lays it out. Full account: `docrender/buildstamp-dl.md` § THE LETTERHEAD.
#
# 🔴 THE VALUE IS THE **STEM** OF A FILENAME. NOT A PATH, NOT AN EXTENSION.
# It resolves through the same index `@img:` uses, which walks every image in the
# CONTENT tree before any page renders. So the file can live anywhere in
# `mawizorek/uritp-safety` and this line never has to know where -- which is the
# whole point, because a `../` count written here would go stale the first time
# either end moved. That arithmetic has shipped wrong three separate times in
# this engine (`links.py`, `router.py`, `datatable.py`).
#
# 🔴 TWO FILES SHARING THIS STEM DISABLE THE LETTERHEAD ENTIRELY, AND THAT IS
# THE ONE TRAP TO KNOW BEFORE EDITING ANYTHING NEARBY. `90-media-logos/` holds
# `logo-horizontal.jpg` today. Dropping a `logo-horizontal.svg` BESIDE it makes
# the name ambiguous -- two pictures with one name are two different pictures --
# and the engine refuses to guess, so the corner silently loses its mark. **An
# SVG must REPLACE the JPEG, not join it.** The build report names the collision
# and the fix, so this fails loudly rather than quietly; it still fails.
#
# ⭐ AND THE JPEG IS CORRECT MEANWHILE, WHICH IS NOT OBVIOUS. Its opaque white
# background is a problem on this site's parchment SCREEN ground and irrelevant
# on paper, because paper is white and this element is print-only. An SVG is a
# crispness upgrade at 300dpi, not a prerequisite.
#
# ⭐ ABSENT MEANS NO LETTERHEAD. Omit this block and a site prints exactly as it
# did -- the same polarity `routes.yml` already has. Five of six sites are
# unchanged by the feature landing, and that is deliberate: a mark is an
# organisation's identity and nothing should assume ours.
#
# ⚠️ THE SEASONAL DATE IS NOT IN HERE AND CANNOT BE. `Fall 2026` rather than an
# explicit print date is engine-owned furniture and lands on every site, per the
# header/footer-content rule above. This block declares WHOSE the sheet is, never
# what the stamp SAYS.
print:
  logo: logo-horizontal


# THE LAST DOOR BACK TO THE SOURCE, DELIBERATELY SHUT (2026-08-16).
#
# `true` puts one quiet "Edit this page on GitHub" line at the foot of every
# page. On `uritp` it was scaffolding.
#
# THIS SITE IS THAT END STATE ON DAY ONE. Every reader here is a designer, guest
# artist or student, so the link is not scaffolding -- it is an affordance
# offered to somebody who cannot use it.
#
# ✅ AND `uritp` SHUT ITS DOOR TOO ON 2026-08-21, for the same reason and by the
# same one-line mechanism -- Michael saw the two sites disagree and preferred
# not to see it. This site's argument was the one that generalised. ⭐ THAT ONE
# STANDS AFTER THE THEME REVERT and is worth separating from it: a footer LINE is
# content, and content is what he wanted consistent. The theme was never that.
#
# AND THE REASON IS NOT LEAK RISK, which is worth stating so nobody "restores"
# it on the grounds that the repo is private. A private repo means the edit URL
# 404s for every reader who is not on it, so nothing is exposed either way. It
# is off because a link that looks like an invitation and delivers a 404 is a
# DEAD CONTROL, and this engine kills those on sight.
#
# ⚠️ AND IT WAS NEVER A PRINT SETTING. `assets/print-chrome.css` hides
# `.pagefoot` and `.pagefoot__rule` in its chrome-off list with `!important`,
# so this line has never reached paper on ANY site. This key governs the SCREEN.
#
# WARNING: PRIVATE REPO IS NOT A PRIVATE SITE. The repo being private stops
# somebody swapping `github.io` for `github.com` and reading the source tree.
# It does nothing whatsoever to the PUBLISHED site, which Pages serves from
# `gh-pages` to anybody with the URL. Nothing in this content tree should be
# written on the assumption that only URITP people can read it.
edit_links: false

# NO `sections:` BLOCK, and its absence is deliberate.
#
# That block exists to ORDER folders and to TITLE the ones with no index page.
# Every folder here has an index that declares its own `order:` (policies 10,
# programs 20, privileges-hazards 30) and its own `title:`, and the engine reads
# the index first -- config only covers what the content cannot speak for.
#
# A `sections:` entry here would restate a fact the content already states, or
# worse, name a folder that does not exist. `uritp`'s block carries a
# `reference:` row for a folder absent from its tree, which is exactly the
# config-key-that-does-nothing this engine keeps writing down.

# NO `peers:` BLOCK, and this one is a judgement rather than a technicality.
#
# `uritp` is the obvious candidate and is deliberately not listed. Cross-site
# links resolve through a peer's published page index, so declaring it would let
# a page here point at the WORKSHOP tree -- sending a reader who came for the
# adopted standard into the draft it was filtered out of. That is the one
# direction this repo exists to prevent.
#
# ⚠️ AND THE THEME REVERT MAKES THIS EASIER TO HOLD, not harder. While the two
# sites looked alike, a peer link was more tempting and no more correct. A safety
# page needing something from `uritp-docs` is a signal that the thing has not
# been filtered yet, not a signal that it needs a link.

# NO `routes.yml` in this folder, and the engine is fine with that: `_uses_router`
# reads the file if it exists and answers False when it does not, so neither
# `router.css` nor `router.js` is even published to a site with no routers.
#
# There should never be one here. A router is a curtain, it protects nothing,
# and the content it would withhold is the content everybody is meant to have
# read. Anything on this site that cannot be shown to everyone does not belong
# on this site.
