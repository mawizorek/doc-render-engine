# URITP SAFETY - the published, human-facing safety surface.
#
# Distinct from `uritp` in the one way that decides everything else: that site
# is where safety material is WORKED OUT, this one is where a finished page
# arrives once Michael has decided a real person can act on it. Two audiences,
# two repos, and they are not copies of each other.
#
# Michael, 2026-08-16: *"this is the final filter that is me taking what we
# write in uritp-docs/safety and filtering it for real humans finally."*
#
# ⚠️ TWO AUDIENCES, ONE LOOK, AS OF 2026-08-21. The split above is about WHAT
# gets published and to whom. It is no longer about how it LOOKS -- see the
# theme block below. A filter is a content decision; it was never a styling one.
#
# CONTENT LAW, and it lives in the content repo's own README as well: agents
# READ and AUDIT this tree and never commit to it. A safety document somebody
# acts on has to have been read by the person accountable for it.
#
# =============================================================================
# 🔴 ONE STRAY CHARACTER ON LINE 1 KILLED EVERY BUILD (2026-08-16)
# =============================================================================
# This file shipped for about an hour reading `l# URITP SAFETY - the published`
# on its first line -- a single `l` before the `#`, almost certainly a mobile
# keyboard slip while opening the editor to change one word further down.
#
# ⚠️ A `#` IS ONLY A COMMENT AT LINE START OR AFTER WHITESPACE. With `l` in
# front of it the whole line becomes a plain SCALAR, so the document opens as a
# string and then meets `name:` fifteen lines later, which is a mapping. YAML
# cannot be both, so `safe_load` RAISES rather than returning a partial config.
#
# ⚡ AND THE FAILURE LANDS NOWHERE NEAR THE EDIT. publish.yml's "Resolve the
# site" step runs a bare `yaml.safe_load(...)['content_repo']` with no
# try/except, so the traceback is about `content_repo` -- a line nobody touched
# -- three steps before the render. build.yml fails the same way in its
# matrix-agreement check. The person who changed a THEME gets an error about a
# REPO, which is the most misleading shape a config error can take.
#
# ⚠️ NOTHING VALIDATES THIS FILE BEFORE A BUILD SPENDS A RUNNER ON IT. Both
# workflows parse it inline, in shell, for one key. A cheap `yaml.safe_load` of
# every instance as its own early step would name the file and the line instead
# -- flagged here rather than built, because it is a workflow change and this
# was a one-character fix on a live outage.

name: URITP Safety
description: Published safety policies, programs and privileges for URITP spaces.
slug: uritp-safety
base_url: https://mawizorek.github.io/uritp-safety/

content_repo: mawizorek/uritp-safety
content_branch: main

# Other names `publish` accepts for this site. Resolved against the slug first,
# then this list, case-insensitively.
#
# WARNING: KEEP IT A ONE-LINE FLOW LIST. The engine parses this with real YAML
# and does not care, but the terminal helper reads it with a regex over one
# line, because a shell function cannot depend on PyYAML being installed.
#
# `safety` is here because it is what anybody will actually type, and it is
# unclaimed: no instance uses it as a slug, and no sibling declares it. That
# check is not a courtesy -- the resolver reads slugs FIRST, so an alias equal
# to another site's slug silently publishes the wrong site.
aliases: [safety, uritp-safety-docs, "URITP Safety"]

# =============================================================================
# ⭐ CONVERGED ON `uritp` (2026-08-21). BOTH URITP SITES NOW RENDER ONE THEME.
# =============================================================================
# > Michael, 2026-08-21: *"Converge both URITP sites on one theme."*
#
# Ruled after being shown WHY the two sites' headers and footers differed: they
# named two different joins with OPPOSITE primary modes, so they opened in
# opposite schemes before a single token differed. The goal is consistent output
# across builds while the style is still being tuned, and ⚡ **the only lever for
# that is this line** -- a content repo has zero say in its own styling
# (doc-render-engine Decision Log J30), so no amount of work inside
# `uritp-safety` could have closed the gap.
#
# 🔴 WHY `uritp` WON AND NOT `uritp-safety`, ON MEASUREMENT RATHER THAN TASTE.
# The `uritp-safety` COLOUR ROWS ARE `papyrus` WITH TWO CELLS CHANGED -- every
# other cell is byte-identical in both the light and dark rows. The two changed
# cells are `data-1` (unconsumed by this engine) and `link`. So the row is not a
# bespoke identity, it is a clone carrying one edit, and that edit is a
# REGRESSION of a fix papyrus had already made:
#
#     uritp-safety       link #52a0d8 on bg #f0e6d2  ->  2.30:1   FAILS AA 4.5
#     uritp-safety-dark  link #3666b3 on bg #241c14  ->  2.97:1   FAILS AA 4.5
#     papyrus            link #7b2d8e on bg #f0e6d2  ->  6.50:1   passes
#     uritp (dark)       link #edffff on bg #000000  -> 20.35:1   passes
#
# ⚡ BOTH SCHEMES OF `uritp-safety` FAIL AA ON THEIR LINK COLOUR, ON THE ONE
# SITE WHOSE READERS ARE STUDENTS AND GUEST ARTISTS ACTING ON SAFETY POLICY.
# maw-themes moved papyrus's link OFF that family on 2026-08-19 for exactly this
# reason ("the same brown as `accent` one shade deeper, so a link on parchment
# read as emphasis") and this row was authored without inheriting the fix.
# 🔴 That is not an argument for switching to papyrus. It is the evidence that
# this row was never measured, which is what disqualifies it.
#
# ⭐ AND `uritp` IS THE IDENTITY THEME, which is the tiebreak the measurement
# does not have to carry alone: black ground, gold accent, `#bd0000` for `bad`,
# and it is one of only four colour rows in the whole table that fill BOTH
# `on-accent` and `link`. This file already named it "a defensible pick on
# identity grounds" for this site before the ruling arrived.
#
# WHAT ACTUALLY CHANGES ON THIS SITE, per vector, verified against the tables:
#
#     color        uritp-safety      -> uritp / uritp-light
#                  PARCHMENT light-primary -> BLACK dark-primary. The visible
#                  change, and the whole point: both sites now open the same way.
#     typography   uritp-safety      -> sharp-racing
#                  base 1.05rem -> 1rem, tracking 0.04em -> 0.02em. ⚠️ The FONT
#                  columns differ (Archivo -> Chakra Petch display) and that is
#                  INVISIBLE: nothing in this engine fetches a webfont, so the
#                  type vector's three font columns have never rendered on any
#                  site. See assets/type.css. Only the ramp moves.
#     forms        uritp-safety      -> sharp
#                  radius 2->4px, radius-lg 4->6px, border-w 1->1.5px,
#                  grad-angle 65->120deg, motion-med 280->200ms, and notably
#                  HEAVIER shadows (0.55/0.35 vs 0.12) which suit a dark ground.
#     spacing      uritp-safety      -> database
#                  ⭐ A GENUINE NO-OP. The two rows are BYTE-IDENTICAL
#                  (40px 2px 8px 2px 5px 8px). Density does not move one pixel.
#
# 🚩 FLAGGED UPSTREAM, NOT FIXED HERE (maw-themes is canonical and this is an
# engine instance file):
#
#   1. `uritp-light` sets `link` = `#16202e`, which is BYTE-IDENTICAL to its own
#      `text`. Contrast is fine (14.59:1) and the affordance is gone -- in light
#      mode a link is indistinguishable from body prose for every reader, not
#      just a colour-blind one. This now affects BOTH URITP sites, which raises
#      its priority. One cell.
#   2. The `uritp-safety` JOIN and its four entities (2 colour rows, typography,
#      forms, spacing) are now UNCONSUMED. Retire or keep is Michael's call --
#      🚫 do not delete on my read, and note the spacing row was already a
#      byte-identical duplicate of `database` before this change.
#   3. Both `uritp` and `uritp-safety` are status `draft` upstream, whose own
#      registry note says promote to `locked` only after a look. ⭐ This
#      convergence makes `uritp` the theme of TWO live sites, so it is now the
#      most-looked-at draft in the fleet and is the one worth promoting.
#
# 🪦 THE CLAIM THIS BLOCK REPLACES WAS ROTTED, and it is struck rather than
# deleted because the correction it carried is still the lesson. The previous
# version argued at length about `database` vs `uritp` and never once mentioned
# that the value actually shipped on the line below was `uritp-safety` -- a file
# whose own comment already carried a same-day correction about a PROXY READ
# PRESENTED AS A VERIFICATION, doing the same thing one paragraph later. ~~The
# theme for this site is `database`.~~ ~~The theme for this site is
# `uritp-safety`.~~ The authority for a theme is the registry plus the resolver,
# and the authority for which theme a SITE wears is this line and nothing else.
#
# Testing an alternative costs nothing and writes nothing to disk: the `theme`
# input on the publish workflow overrides this for ONE build. Reverting the
# convergence is one word.

theme: uritp

