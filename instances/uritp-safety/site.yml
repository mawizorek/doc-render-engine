# URITP SAFETY - the published, human-facing safety surface.
#
# Distinct from `uritp` in the one way that decides everything else: that site
# is where safety material is WORKED OUT, this one is where a finished page
# arrives once Michael has decided a real person can act on it. Two audiences,
# two repos, and they are not copies of each other.
#
# Michael, 2026-08-16: *"this is the final filter that is me taking what we
# write in uritp-docs/safety and filtering it for real humans finally."*
#
# CONTENT LAW, and it lives in the content repo's own README as well: agents
# READ and AUDIT this tree and never commit to it. A safety document somebody
# acts on has to have been read by the person accountable for it.
#
# =============================================================================
# 🔴 ONE STRAY CHARACTER ON LINE 1 KILLED EVERY BUILD (2026-08-16)
# =============================================================================
# This file shipped for about an hour reading `l# URITP SAFETY - the published`
# on its first line -- a single `l` before the `#`, almost certainly a mobile
# keyboard slip while opening the editor to change one word further down.
#
# ⚠️ A `#` IS ONLY A COMMENT AT LINE START OR AFTER WHITESPACE. With `l` in
# front of it the whole line becomes a plain SCALAR, so the document opens as a
# string and then meets `name:` fifteen lines later, which is a mapping. YAML
# cannot be both, so `safe_load` RAISES rather than returning a partial config.
#
# ⚡ AND THE FAILURE LANDS NOWHERE NEAR THE EDIT. publish.yml's "Resolve the
# site" step runs a bare `yaml.safe_load(...)['content_repo']` with no
# try/except, so the traceback is about `content_repo` -- a line nobody touched
# -- three steps before the render. build.yml fails the same way in its
# matrix-agreement check. The person who changed a THEME gets an error about a
# REPO, which is the most misleading shape a config error can take.
#
# ⚠️ NOTHING VALIDATES THIS FILE BEFORE A BUILD SPENDS A RUNNER ON IT. Both
# workflows parse it inline, in shell, for one key. A cheap `yaml.safe_load` of
# every instance as its own early step would name the file and the line instead
# -- flagged here rather than built, because it is a workflow change and this
# was a one-character fix on a live outage.

name: URITP Safety
description: Published safety policies, programs and privileges for URITP spaces.
slug: uritp-safety
base_url: https://mawizorek.github.io/uritp-safety/

content_repo: mawizorek/uritp-safety
content_branch: main

# Other names `publish` accepts for this site. Resolved against the slug first,
# then this list, case-insensitively.
#
# WARNING: KEEP IT A ONE-LINE FLOW LIST. The engine parses this with real YAML
# and does not care, but the terminal helper reads it with a regex over one
# line, because a shell function cannot depend on PyYAML being installed.
#
# `safety` is here because it is what anybody will actually type, and it is
# unclaimed: no instance uses it as a slug, and no sibling declares it. That
# check is not a courtesy -- the resolver reads slugs FIRST, so an alias equal
# to another site's slug silently publishes the wrong site.
aliases: [safety, uritp-safety-docs, "URITP Safety"]

# =============================================================================
# 🪦 THE CONVERGENCE IS REVERSED (2026-08-21, ~90 minutes after it shipped)
# =============================================================================
# > Michael, 2026-08-21: *"papyrus and uritp-safety theme need to be back on
# > that site. i misunderstood what you were doing. no each site gets their own
# > theme join - but the content that appears in the header or footer on print
# > should not differ per site - that's what i meant."*
#
# 🔴 THE RULING IT REVERSES WAS ANSWERING A QUESTION NOBODY ASKED, AND THAT IS
# THE LESSON WORTH KEEPING. ~~Converge both URITP sites on one theme.~~ arrived
# out of a conversation about two PRINTED sheets looking different, and the theme
# was the lever that made the difference go away -- so it got pulled. But the ask
# was about the printed FURNITURE (what the header and footer SAY), not about the
# palette. **A theme was changed to fix a header.**
#
# ⭐ EACH SITE KEEPS ITS OWN THEME JOIN. That is the standing rule now, stated
# rather than inferred: a per-site look is the whole point of `theme:` being a
# per-instance key, and two sites sharing an audience is not a reason to share a
# palette.
#
# ⚠️ AND THE REAL REQUIREMENT IS NOT IN THIS FILE AT ALL. Printed header/footer
# CONTENT is engine-owned and already identical on every site: the chrome-off
# list is `assets/print-chrome.css` and the corner stamp is
# `docrender/buildstamp.py`. Neither reads a theme, and `edit_links:` has never
# reached paper. 🔴 The one thing that WOULD make printed header content differ
# per site is the declared letterhead logo in `specs/print-identity.md` §4, which
# is not built -- so if the sheets still disagree after this revert, the
# difference is COLOUR, and colour is supposed to differ.
#
# ✅ AND THAT LAST PARAGRAPH IS NOW HALF OUT OF DATE, WHICH IS WORTH READING
# CAREFULLY RATHER THAN DELETING (2026-08-29). The letterhead IS built, and the
# `print:` block below declares it -- so printed header content DOES now differ
# per site, by design, and this file is where that difference is authored.
#
# ⭐ THE RULE IT LOOKS LIKE IT BREAKS IS ACTUALLY INTACT, AND THE DISTINCTION IS
# MICHAEL'S OWN. His objection was to the header/footer *CONTENT* differing --
# meaning the WORDS and the FURNITURE, which is why the seasonal date format
# above the fold is engine-owned and lands identically on all six sites with no
# per-site key at all. **A letterhead is not furniture, it is IDENTITY**, and
# identity is the one thing a per-site file is for. The stamp still says the same
# KIND of thing everywhere: this site's name, this site's period, this site's
# mark.
#
# =============================================================================
# 🔴 WHAT THE REVERT COSTS, AND IT IS A REAL ACCESSIBILITY REGRESSION
# =============================================================================
# The measurement that argued for the convergence is still true and does not go
# away because the ruling did. The `uritp-safety` COLOUR ROWS ARE `papyrus` WITH
# TWO CELLS CHANGED, and one of the changed cells is `link`:
#
#     uritp-safety       link #52a0d8 on bg #f0e6d2  ->   2.30:1   FAILS AA 4.5
#     uritp-safety-dark  link #3666b3 on bg #241c14  ->   2.97:1   FAILS AA 4.5
#     papyrus            link #7b2d8e on bg #f0e6d2  ->   6.50:1   passes
#
# ⚡ SO BOTH SCHEMES OF THE THEME THIS LINE NOW NAMES FAIL AA ON THEIR LINK
# COLOUR, ON THE SITE WHOSE READERS ARE STUDENTS AND GUEST ARTISTS ACTING ON
# SAFETY POLICY. maw-themes moved papyrus's link OFF that family on 2026-08-19
# for exactly this reason and this row was authored without inheriting the fix.
#
# ⭐ BUT THAT WAS NEVER AN ARGUMENT FOR A DIFFERENT THEME -- IT IS AN ARGUMENT
# FOR FIXING ONE CELL. 🔴 THE FIX IS UPSTREAM AND IT IS ONE VALUE:
# `uritp-safety.link` -> `#7b2d8e` (papyrus's, 6.50:1) in maw-themes
# `canonical/colors.tsv`, and the same for the dark row. That keeps the identity
# and clears the floor, which is what both sides of this argument actually
# wanted. 🚩 FLAGGED FOR MICHAEL, not done here: maw-themes is canonical and this
# is an engine instance file.
#
# ⚠️ STILL OPEN AS OF 2026-08-29 and it does NOT touch the letterhead either way:
# a link colour is a SCREEN defect on this site, and the print layer strips link
# colour anyway (print-type.css §5). The two are unrelated, said out loud so
# nobody reads the letterhead landing as this being addressed.
#
# 🚩 ALSO STILL OPEN UPSTREAM, unchanged by the revert: `uritp-light` sets `link`
# BYTE-IDENTICAL to its own `text`, so in light mode a link is indistinguishable
# from body prose. That now affects `uritp` only again rather than both sites.
#
# Testing an alternative costs nothing and writes nothing to disk: the `theme`
# input on the publish workflow overrides this for ONE build.

theme: uritp-safety

