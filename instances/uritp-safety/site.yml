# URITP SAFETY - the published, human-facing safety surface.
#
# Distinct from `uritp` in the one way that decides everything else: that site
# is where safety material is WORKED OUT, this one is where a finished page
# arrives once Michael has decided a real person can act on it. Two audiences,
# two repos, and they are not copies of each other.
#
# Michael, 2026-08-16: *"this is the final filter that is me taking what we
# write in uritp-docs/safety and filtering it for real humans finally."*
#
# CONTENT LAW, and it lives in the content repo's own README as well: agents
# READ and AUDIT this tree and never commit to it. A safety document somebody
# acts on has to have been read by the person accountable for it.
#
# =============================================================================
# 🔴 ONE STRAY CHARACTER ON LINE 1 KILLED EVERY BUILD (2026-08-16)
# =============================================================================
# This file shipped for about an hour reading `l# URITP SAFETY - the published`
# on its first line -- a single `l` before the `#`, almost certainly a mobile
# keyboard slip while opening the editor to change one word further down.
#
# ⚠️ A `#` IS ONLY A COMMENT AT LINE START OR AFTER WHITESPACE. With `l` in
# front of it the whole line becomes a plain SCALAR, so the document opens as a
# string and then meets `name:` fifteen lines later, which is a mapping. YAML
# cannot be both, so `safe_load` RAISES rather than returning a partial config.
#
# ⚡ AND THE FAILURE LANDS NOWHERE NEAR THE EDIT. publish.yml's "Resolve the
# site" step runs a bare `yaml.safe_load(...)['content_repo']` with no
# try/except, so the traceback is about `content_repo` -- a line nobody touched
# -- three steps before the render. build.yml fails the same way in its
# matrix-agreement check. The person who changed a THEME gets an error about a
# REPO, which is the most misleading shape a config error can take.
#
# ⚠️ NOTHING VALIDATES THIS FILE BEFORE A BUILD SPENDS A RUNNER ON IT. Both
# workflows parse it inline, in shell, for one key. A cheap `yaml.safe_load` of
# every instance as its own early step would name the file and the line instead
# -- flagged here rather than built, because it is a workflow change and this
# was a one-character fix on a live outage.

name: URITP Safety
description: Published safety policies, programs and privileges for URITP spaces.
slug: uritp-safety
base_url: https://mawizorek.github.io/uritp-safety/

content_repo: mawizorek/uritp-safety
content_branch: main

# Other names `publish` accepts for this site. Resolved against the slug first,
# then this list, case-insensitively.
#
# WARNING: KEEP IT A ONE-LINE FLOW LIST. The engine parses this with real YAML
# and does not care, but the terminal helper reads it with a regex over one
# line, because a shell function cannot depend on PyYAML being installed.
#
# `safety` is here because it is what anybody will actually type, and it is
# unclaimed: no instance uses it as a slug, and no sibling declares it. That
# check is not a courtesy -- the resolver reads slugs FIRST, so an alias equal
# to another site's slug silently publishes the wrong site.
aliases: [safety, uritp-safety-docs, "URITP Safety"]

# ONE LINE. `database`, by Michael's choice, 2026-08-16.
#
# =============================================================================
# 🔴 CORRECTION, SAME DAY, SAME FILE: THE CLAIM THAT WAS HERE WAS FALSE
# =============================================================================
# An earlier version of this comment stated that `database` was a nine-token
# LOCAL skin with no canonical row, that the four-vector join therefore never
# happened, and that eleven of the thirteen callout families -- INCLUDING
# `danger` -- would fall back to `currentColor` and render grey on a safety site.
#
# None of that is true, and it was committed here in the voice of something
# verified. What is actually true, read off the registry and the resolver:
#
#     `database` IS a canonical JOIN, in maw-themes registry/_themes.json:
#         color        mercedes
#         alt-color    mercedes-light
#         typography   sharp-racing
#         forms        sharp
#         spacing      database
#
# So `vectors.resolve()` finds the join, takes `mercedes`, and `color_row()`
# returns a real row. This site gets the FULL four-vector join. The `mercedes`
# row carries `bad` = #d64f3f, which is the token the `danger` family asks for,
# so a `!!! danger` box on this site DOES get its red border.
#
# ⚑ HOW THE WRONG CLAIM HAPPENED, because the SHAPE is worth more than the
# error. It was read off `theme/themes.tsv` -- the engine's LOCAL nine-token
# underlay -- plus a Decision Log entry of 2026-08-05 naming `utility`,
# `database` and `base` as that local set. Both sources are accurate about the
# LOCAL table. Neither is the authority on what a theme resolves to.
# `docrender/vectors.py` says in plain text that `eos`, `papyrus` and `database`
# exist as both a join and an entity and that JOIN WINS -- and that file was not
# opened before the claim was written. A PROXY READ PRESENTED AS A VERIFICATION.
# The authority for a theme is the registry plus the resolver, and nothing else.
#
# ⚠️ WHAT IS GENUINELY WORTH KNOWING, and it survives the correction: upstream
# marks `database` status DRAFT, and its own registry entry says it was
# "composed but never rendered -- nothing has consumed it yet, so nobody has
# looked at it. Promote to locked only after it has been seen."
#
# THIS SITE IS ITS FIRST CONSUMER. The theme is UNPROVEN rather than broken, and
# this build is the render somebody finally has to judge. If it reads well, that
# is the evidence upstream is waiting for to promote it to `locked`.
#
# ⭐ AND A THIRD OPTION NOBODY HAS PUT ON THE TABLE: `uritp` is also a canonical
# join (also draft), carrying actual URITP identity -- black ground, gold accent,
# #bd0000 for `bad`, and it is one of only four colour rows in the whole table
# that fill BOTH `on-accent` and `link`. On a URITP safety site that is a
# defensible pick on identity grounds rather than on measurement. Stated so it
# is a choice rather than an omission.
#
# Testing an alternative costs nothing and writes nothing to disk: the `theme`
# input on the publish workflow overrides this for ONE build.

theme: uritp-safety

