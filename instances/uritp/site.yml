# URITP - the first REAL site on the matrix publishing path.
#
# Distinct from `template` in the one way that matters: this one is published
# by build.yml into its own content repo's gh-pages branch, at its own address,
# for its own audience. The template is served from the engine's Pages as a
# special case; this is the ordinary path every real site uses.

name: URITP Production Resources
description: Venue information, technical standards, and production reference.
slug: uritp
base_url: https://mawizorek.github.io/uritp-docs/

content_repo: mawizorek/uritp-docs
content_branch: main

# ⭐ OTHER NAMES THIS SITE ANSWERS TO ON THE COMMAND LINE (added 2026-08-05).
#
# `publish` (the terminal helper) resolves whatever you type against the slug
# first and then this list. Case-insensitive; declare them however reads best.
#
# WHY THEY LIVE HERE AND NOWHERE ELSE. The alternative was an alias table in
# one laptop's ~/.zshrc, which is a fourth hand-maintained copy of the site
# list -- invisible to this repo, unreviewable, and true on exactly one
# machine. This family already forgot the THIRD copy once (`hml` shipped
# buildable-but-unpublishable for two days because publish.yml's dropdown was
# not touched). A name that resolves to a site is a fact about the site.
#
# ⚠️ NOT A TITLE, AND THIS IS THE POINT. `name:` above is prose and Michael is
# about to change it to "URITP PRP". An alias survives that rename because it
# is an identifier that happens to be readable, not a copy of a heading. Never
# bind a command to a title -- the title is the thing most likely to be edited.
#
# ⚠️ KEEP IT A ONE-LINE FLOW LIST. The engine parses this with real YAML and
# does not care, but the terminal helper reads it with a regex over one line,
# because a shell function cannot depend on PyYAML being installed. A block
# list still builds and still reports; it just will not resolve in the shell.
aliases: [uritp-docs, "URITP PRP", "URITP Production Resources", prp]

# ONE LINE. A theme names FIVE pointers -- two colours, one typography, one
# forms, one spacing -- so a single word here dresses the entire site in both
# toggle states. The full contract is maw-themes docs/HOW-A-THEME-IS-CHOSEN.md.
#
#     theme: eos          -> dark from eos, light from eos-light
#
# A SECOND theme REPLACES the alt, and the app always owns which slot is which:
#
#     theme:
#       dark: sharp-mclaren
#       light: papyrus        # papyrus's PRIMARY colour, not its alt
#
# WARNING: NAME A THEME, NOT A PALETTE. `mclaren` is a colour entity; the themes
# using it are `sharp-mclaren` and `mclaren-mobile`. A bare palette still
# resolves for compatibility and gets colour ONLY -- no canonical type, radii or
# density -- and the build says so when it happens.
#
# THE EOS PALETTE IS THE ETC CONSOLE, AND ITS SEMANTICS ARE A LANGUAGE (2026-08-05).
# The dark row is the console's blue-tinted charcoal in BLIND; the five semantic
# tokens carry the board's own grammar -- magenta tracked, blue intensity-up,
# green lower/marked, gold captured, red manual. Those are not taste. A board op
# reads them faster than a label, so re-colouring one breaks a language rather
# than a palette.
#
# (The per-token identification harness that lived on this row until 2026-08-05
# is retired. It existed to prove every surface resolved to a named token, it
# did that, and a fixture that has finished proving its point is just a broken
# palette. Do not re-add loud values here to debug -- change ONE cell upstream in
# maw-themes and publish, which is the whole reason the join exists.)
#
# =============================================================================
# 🚦 EACH SITE KEEPS ITS OWN THEME JOIN (2026-08-21, Michael, standing rule)
# =============================================================================
# > *"papyrus and uritp-safety theme need to be back on that site. i
# > misunderstood what you were doing. no each site gets their own theme join --
# > but the content that appears in the header or footer on print should not
# > differ per site - that's what i meant."*
#
# 🔴 A THEME WAS CHANGED TO FIX A HEADER, ON BOTH URITP SITES, AND THAT IS THE
# MISTAKE THIS LINE REVERSES. The conversation was about two PRINTED sheets
# looking different; the theme is the lever that made the difference disappear,
# so it got pulled -- but the ask was about what the printed furniture SAYS, not
# about the palette. `papyrus` is restored here and `uritp-safety` on its own
# site.
#
# ⚠️ AND THE REAL REQUIREMENT IS NOT A THEME KEY AT ALL. Printed header/footer
# CONTENT is engine-owned and already identical on every site: the chrome-off
# list lives in `assets/print-chrome.css` and the corner stamp in
# `docrender/buildstamp.py`. Neither reads a theme. 🔴 The one thing that WOULD
# make printed header content differ per site is the declared letterhead logo in
# `specs/print-identity.md` §4, which is NOT BUILT -- so if two sheets still
# disagree after this, the difference is COLOUR, and colour is meant to differ.
#
# ⚡ ONE HONEST CAVEAT ON "already identical": `print-chrome.css` was ITSELF
# unpublished until 2026-08-21 (on disk, absent from `_PRINT_ASSETS`), so the
# chrome-off list and the corner stamp have never actually reached paper on any
# site. They do now. **Whatever the printed sheets looked like before today is
# not evidence of what they will look like next publish.**
#
# 🔴 AND THAT "NOT BUILT" CLAUSE WENT STALE ON 2026-08-29 AND COST A ROUND ON
# 2026-08-30. The letterhead IS built, and it was declared on `uritp-safety`
# only -- so this site printed no mark while its sibling did, which is exactly
# the per-site header difference the paragraph above calls out. It is declared
# below now. ⚑ *A sentence that says a feature does not exist is a fact with an
# expiry date, and nothing fails when it passes.*

# theme: uritp
# theme: sharp-utility
# theme: eos
# theme: mclaren
# theme: sharp-mclaren
# theme: mclaren-mobile
# theme: grounded-neutral
# theme: sharp-utility
# theme: soft-utility
# theme: soft-mercedes
# theme: sharp-carbon
# theme: database
# theme: on-track
theme: eos
# theme: f1-racetracks
# theme: papyrus

# 🚩 STILL OPEN UPSTREAM, and it is why `uritp` was briefly attractive: the
# `uritp-light` colour row sets `link` BYTE-IDENTICAL to its own `text`
# (`#16202e`), so in light mode a link is indistinguishable from body prose for
# every reader. Contrast is fine (14.59:1); the AFFORDANCE is gone. One cell in
# maw-themes `canonical/colors.tsv`. Not fixed here -- maw-themes is canonical
# and this is an engine instance file.
#
# 🔴 AND THE `owner:` BLOCK BELOW JUST GAVE IT A NEW READER, same as it did on
# `uritp-safety`: the ownership tag ends in a `mailto:` ANCHOR at the foot of
# every page, so on the light row that address is now indistinguishable from the
# prose beside it. The tag does not cause the defect and does not change its fix;
# it removes the last excuse for calling it cosmetic. Print strips link colour
# (print-type.css §5), so this is a SCREEN defect only.


# =============================================================================
# ⭐ THE PRINTED LETTERHEAD (declared here 2026-08-30; feature built 2026-08-29)
# =============================================================================
# The mark that prints at the top-left of sheet one, beside the site name and
# the period. `docrender/buildstamp.py` resolves it; `assets/print-identity.css`
# lays it out. Full account: `docrender/buildstamp-dl.md` § THE LETTERHEAD.
#
# 🔴 THE VALUE IS THE **STEM** OF A FILENAME. NOT A PATH, NOT AN EXTENSION. It
# resolves through the same index `@img:` uses, which walks every image in the
# CONTENT tree before any page renders, so the file can live anywhere in
# `mawizorek/uritp-docs` and this line never has to know where.
#
# ✅ VERIFIED PRESENT BEFORE DECLARING: `90-media-logos/logo-horizontal.jpg`
# (171,760 B) exists on `uritp-docs@main`. A stem naming no file prints no
# letterhead and reports it -- so this was checked rather than copied across on
# the assumption that two URITP repos hold the same assets.
#
# 🔴 TWO FILES SHARING THIS STEM DISABLE THE LETTERHEAD ENTIRELY. `logo-square.jpg`
# sits beside it and is a DIFFERENT stem, so there is no collision today. Adding
# a `logo-horizontal.svg` would make the name ambiguous and the corner would
# silently lose its mark -- **an SVG must REPLACE the JPEG, not join it.**
#
# ⚠️ AND THIS IS THE HEADER HALF OF WHAT `uritp-safety` GOT. It is declared here
# because a printed sheet from either URITP site should carry the same furniture;
# it is a PER-SITE key because a mark is an organisation's identity and the engine
# must not assume ours. Absent means no letterhead, which is still the default for
# `hml`, `mawprose`, `theatre` and `template`.
print:
  logo: logo-horizontal


# =============================================================================
# ⭐ THE OWNERSHIP TAG (declared here 2026-08-30) -- ONE FOOTER LINE, TWO ENDS
# =============================================================================
# On every page of this site:
#
#     Revised Aug 2026        Posted by Michael A Wizorek
#                          michael.wizorek@rochester.edu
#
# `docrender/lede.py` `owner()` draws it; `assets/foot.css` floats it right of
# the revision line, which keeps its own left position, font, size and colour.
# `print-space.css` §9 excludes it from justification -- without that exclusion
# it prints flush LEFT, which is a real defect the sibling site hit first.
#
# 🔴 WHY IT WAS MISSING HERE, AND IT IS THE ANSWER TO A REAL QUESTION MICHAEL
# ASKED THE SAME DAY: *"why didnt URITP ProductionResources doc render site not
# take the same header and footer alterations ... i thought that was the whole
# point of the renderer?"*
#
# **The renderer DID share everything it owns.** This site was already serving
# the identical bytes -- `foot.63f3ef78.css` (18,194 B) and
# `print-space.c1041ead.css` (21,654 B), byte-for-byte the sibling's sheets. The
# MECHANISM travelled on the next publish with no per-site work at all, which is
# exactly the point of the engine.
#
# ⚑ **What did not travel is the DECLARATION, because a name and an address are
# IDENTITY and identity is per-site by design.** `owner()` returns an empty
# string when the key is absent, so the tag rendered nothing here and nothing was
# reported -- the same absent-means-off polarity `print:` and `routes.yml` have.
# The engine shares MACHINERY; a site still has to say who it belongs to.
#
# 🔴 THE HONEST PART: that polarity was a deliberate choice made on 08-30 and
# written up as *"five of six sites are untouched by this landing"* -- stated as a
# feature, and nobody was asked whether the OTHER URITP site wanted it. **A
# default that is documented is still a default that was never agreed.** The two
# URITP sites share an audience and an author, so on this pair the answer was
# always going to be yes.
#
# ⚠️ THE ENGINE OWNS THE WORD `Posted by`. This block holds a name and an address
# and nothing else, which is what keeps the phrasing identical across both sites
# and every sheet in a printed packet. 🚩 Do NOT add a label key here -- a per-site
# LABEL is the one thing the header/footer-content rule above forbids.
#
# ⚠️ THE ADDRESS IS THE WORK ONE, ON PURPOSE, and the spelling is `wizorek`. A
# dictated `michael.wazorek@` was caught on the sibling site before it shipped;
# `mawizorek@gmail.com` is the personal account and was refused for this surface.
# Copied from `instances/uritp-safety/site.yml` rather than retyped.
#
# ⚠️ WHAT THIS TAG DOES NOT DO: it claims MAINTENANCE without proving any. It
# renders unconditionally while `revised:` stays optional, so a page with no date
# carries a named owner and no evidence anybody has looked at it since -- and this
# tree is the LARGER of the two, so the exposure is bigger here. Raised 08-30 and
# deferred by Michael to the revision-log / update-cycle conversation. Not fixed,
# and not to be read as fixed.
owner:
  name: Michael A Wizorek
  email: michael.wizorek@rochester.edu


# THE LAST DOOR BACK TO THE SOURCE, NOW SHUT (2026-08-21).
#
# `true` keeps ONE quiet line at the foot of each page: "Edit this page on
# GitHub". Nothing else in the rendered site mentions a repository -- the
# header widget is gone and `repo_url` is never set.
#
# ⭐ THE END STATE ARRIVED, AND IT ARRIVED BY BEING SEEN RATHER THAN BY BEING
# SCHEDULED. This comment used to say `false` was "the intended end state once
# these go out to designers, guest artists and students: the line is
# scaffolding for now." Michael, 2026-08-21, comparing this site against
# `uritp-safety` side by side: *"the footer saying 'edit on github' for uritp
# docs and not in uritp-safety (prefered to not see it)."* The two sites
# disagreeing is what made the scaffolding visible as scaffolding.
#
# ✅ AND THIS ONE SURVIVES THE THEME REVERT, which is worth separating out
# because both changes came from the same side-by-side comparison. A footer LINE
# is CONTENT, and consistent content across sites is exactly what was asked for.
# The palette was never that.
#
# ⭐ AND IT IS THE PRECEDENT THE `owner:` BLOCK ABOVE SHOULD HAVE BEEN READ
# AGAINST ON 08-30. The same side-by-side comparison, the same pair of sites, the
# same conclusion: **footer content that differs between these two is a defect,
# not a feature.** That ruling was eleven days old and sitting in this file.
#
# 🔴 AND IT WAS NEVER A PRINT FIX, WHICH MATTERS BECAUSE THAT IS THE QUESTION IT
# CAME OUT OF. `assets/print-chrome.css` already hides `.pagefoot` and
# `.pagefoot__rule` in its chrome-off list with `!important`, so the edit line
# has never reached paper on ANY site. This key governs the SCREEN only. Anybody
# reading this while chasing a difference between two PRINTED sheets is in the
# wrong file -- the printed corner stamp is `docrender/buildstamp.py`.
#
# ⚠️ AND THE OWNERSHIP TAG IS NOT GOVERNED BY THIS KEY. They are both foot lines
# about where a page came from and they are opposites: the edit line is
# SCAFFOLDING for a builder, hidden on paper and switched off here; the tag is
# CONTENT for a reader, and paper is the surface it was built for.
#
# ⚠️ THE OTHER SITES STILL DEFAULT ON. `pagefoot.py` `_enabled()` treats a
# missing key as `true`, so `hml`, `mawprose`, `theatre` and `template` keep the
# line until each one opts out. Not swept here on purpose: `template` is the
# engine's own gold standard and a developer-facing site is exactly where the
# line still earns its place.
#
# Environment override for a one-off build: DOCRENDER_EDITLINK=0.
edit_links: false

# WARNING: THE `palette:` BLOCK IS GONE (2026-08-04). This note replaces it so
# nobody puts it back.
#
# It set Material's header and accent to NAMED colours (`black`, `amber`) and
# carried the comment "Kept in step with the eos accent by hand." That was hand
# mirroring, admitted in writing, and it went out of step the moment the palette
# became canonical.
#
# WARNING AND REMOVING IT DID NOT FIX THE BLUE LINK, WHICH IS WHAT THE COMMIT
# THAT REMOVED IT CLAIMED (corrected 2026-08-05). Material writes
# `data-md-color-primary="indigo"` on the body by DEFAULT, whether or not this
# file sets a primary, and ships a compound rule that outranks a single-attribute
# scope. The real fix is the armour block in assets/base.css, which matches the
# ATTRIBUTE and never its value. Re-adding a `palette:` key here still does
# nothing, and is still reported -- but do not expect deleting things to be what
# fixed the links.

# Titles here are a FALLBACK. A folder that contains an index.md takes that
# page's own title instead, so `venues/spac/` shows as "Swan Auditorium" rather
# than "Spac". Only folders with no index page need naming here.
sections:
  venues:
    order: 10
  production:
    order: 20
  safety:
    order: 30
  reference:
    order: 40

# The cross-site contract, pointed at a site that is ACTUALLY LIVE. This is the
# first real test of `@peer:id` against a published doc-index.json rather than
# against a hypothetical.
peers:
  template: https://mawizorek.github.io/doc-render-engine/

# Full leak scan, no opt-out. "uritp" is a proper noun that appears nowhere in
# the engine's code, objects, theme or assets, so the check is both safe to run
# and genuinely meaningful here -- unlike `template` and `theatre`, whose slugs
# are ordinary words. This instance is the one that actually proves the engine
# is site-agnostic.
#
# ⚠️ THE ALIASES ABOVE ARE NOT SCANNED, and that is correct rather than an
# oversight: the scan walks docrender/, objects/, theme/, assets/ and hooks/,
# which is ENGINE code. instances/ is the data the engine reads, and naming this
# site here is the entire purpose of the file. sizecheck's own error message says
# so -- "Move it to instances/<slug>/site.yml" is where it sends a leak.
#
# ⚠️ AND AS OF 2026-08-21 IT NO LONGER SCANS `theme/canonical/`, which is what
# had been failing every build here since the 08-19 re-vendor added colour rows
# `uritp` and `uritp-light` upstream. See docrender/sizecheck.py `_LEAK_SKIP`.
# The claim above is unchanged and still true of everything the engine AUTHORS.
