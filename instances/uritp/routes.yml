# ROUTE TABLES for this site. The single editable source for durable codes.
#
# A page opts in with `router: <table>` in its frontmatter and renders a text
# field. Three kinds of entry, and the DESTINATION decides which -- there is no
# mode flag to set:
#
#     pm:
#       maw:                      PORTABLE CURTAIN. No destination, so it means
#                                 "curtain on whatever page declares this
#                                 table." One entry, reusable on any number of
#                                 pages, never needs to know their ids. This is
#                                 the right shape for a ROLE table.
#
#     staff:
#       staff26: staff            PINNED CURTAIN. Names the id of the page it is
#                                 used on. Same behaviour, tied to that one page
#                                 -- what you want when one table holds curtains
#                                 for several different pages.
#
#       loadin24: crew-call-sheet REDIRECT. Names a DIFFERENT page and sends you
#                                 there. The value is a page `id`, never a path,
#                                 so the route survives the destination being
#                                 moved or renamed.
#
# A key pointing at an id that does not exist is reported at build time rather
# than failing silently for whoever types it.
#
# ⚠️ NOT SECURITY, and the name is the reminder. A router does not know where to
# send someone who types the wrong thing; it does not stop them getting there
# another way. The site is public and every destination is reachable by URL.
# A curtain HIDES a page body in the DOM -- it does not encrypt it. Never put
# anything behind one that would matter if a stranger read it.
#
# ⚠️ KEYS HERE ARE VISIBLE TO ANYONE WITH ACCESS TO THIS REPO. That is still the
# better of the two options: the alternative is a content repo that is public
# and has a Download ZIP button. For a throwaway code, `router_code:` in the
# page itself is easier and honest about being throwaway.
#
# Pair a curtain with `status: unlisted` if the page should not appear in the
# sidebar. `public` is right when the page should be findable and the code is
# only a pause.

staff:
  staff26: staff

# Role table. Any page that declares `router: pm` accepts this code and reveals
# its own body -- no per-page entry, no ids to keep in step.
pm:
  maw:
