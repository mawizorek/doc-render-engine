# ROUTE TABLES for this site. Michael's single editable source for keys.
#
# A page opts in with `router: <table>` in its frontmatter and renders a text
# field. Type a key from that table, get sent to the page it names.
#
#     crew:
#       loadin24: crew-call-sheet
#       grid: spac-main-stage
#
# The VALUE on the right is a page `id`, never a path or a URL -- so a route
# survives the destination page being moved or renamed, exactly like every
# other link in this family. A key pointing at an id that does not exist is
# reported at build time rather than failing silently for whoever types it.
#
# ⚠️ NOT SECURITY, and the name is the reminder. A router does not know where
# to send someone who types the wrong thing; it does not stop them going there
# another way. The site is public and every destination is reachable by URL.
# Use it to keep a casual reader out of the way, or to hand one person a code.
# Never put anything here that would matter if a stranger read it.
#
# ⚠️ THE KEYS ARE VISIBLE TO ANYONE WITH ACCESS TO THIS REPO. That is why they
# live in the ENGINE and not in the content repo, which is public and has a
# Download ZIP button that would ship them with the documents.
#
# Pair a router with `status: unlisted` on its destinations. Not enforced --
# sometimes a destination is deliberately public -- but a router pointing at a
# page already in the sidebar is a router with nothing to do.
#
# Empty for now. Add a table when there is a real reason for one.
