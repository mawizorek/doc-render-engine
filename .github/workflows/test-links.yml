name: Link resolver regression tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install 'Markdown>=3.6,<4' 'PyYAML>=6'
      - name: Test the real resolver and Markdown output
        run: python -m unittest discover -s tests -v
