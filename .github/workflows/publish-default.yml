name: Publish the default site

# WHY THIS EXISTS SEPARATELY FROM build.yml.
#
# build.yml is the app matrix: it renders each site and pushes the result into
# THAT site's own content repo, which is a cross-repository write and therefore
# needs a PAT a human has to mint. Until that secret exists the whole family is
# buildable and none of it is live, and "buildable" is not a claim anybody can
# check.
#
# The gold standard has to be LIVE, because that is the entire premise: a
# written specification rots, an executable one cannot. So the default instance
# publishes into THIS repository, which the built-in GITHUB_TOKEN can write to
# with no secret at all.
#
# It uses the SAME mechanism as every real site -- render, then push the result
# to a gh-pages branch -- and differs only in which repo that branch lives in.
# That matters: a gold standard that proves a code path nothing else uses is
# not a gold standard, it is a demo.
#
# FIRST ATTEMPT, RECORDED BECAUSE IT WILL BE TRIED AGAIN OTHERWISE: this job
# originally used actions/configure-pages with `enablement: true` plus the
# upload-artifact/deploy-pages trio, on the theory that Pages could be switched
# on through the API and remove the last human step. The Configure Pages step
# failed outright -- the workflow token cannot enable Pages on this repo -- and
# it failed FIRST, which skipped the render and destroyed the one signal the
# run existed to produce. Hence the order below: render before publish, always.

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Same rhythm as the matrix. The content repo holds no workflow of its own
    # -- that is the purity rule -- so it cannot tell us it changed.
    - cron: "23 7 * * *"

permissions:
  contents: write

concurrency:
  group: publish-default
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      DOCRENDER_INSTANCE: template
    steps:
      - name: Check out the engine
        uses: actions/checkout@v4
        with:
          path: engine

      - name: Check out the content
        uses: actions/checkout@v4
        with:
          repository: maw-agents/template-docs
          path: content
          # Two commits so the build stamp can name the change it rendered.
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - name: Install the renderer
        working-directory: engine
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Render
        env:
          DOCRENDER_CONTENT: ${{ github.workspace }}/content
          DOCRENDER_OUTPUT: ${{ github.workspace }}/site
          DOCRENDER_ENGINE_REF: ${{ github.sha }}
        run: |
          cd "${{ github.workspace }}/content"
          echo "DOCRENDER_COMMIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          {
            echo "DOCRENDER_COMMIT_SUBJECT<<EOF"
            git log -1 --pretty=%s
            echo "EOF"
          } >> "$GITHUB_ENV"
          cd "${{ github.workspace }}/engine"
          mkdocs build --config-file mkdocs.yml

      - name: Prove something was actually rendered
        # A publish step will happily push an empty directory and report
        # success. Then the site is "live" and blank, which is the worst of the
        # three possible outcomes because it looks like it worked.
        run: |
          test -f "${{ github.workspace }}/site/index.html" \
            || { echo "::error::no index.html in the build output"; exit 1; }
          pages=$(find "${{ github.workspace }}/site" -name '*.html' | wc -l)
          echo "rendered $pages html files"
          [ "$pages" -ge 2 ] \
            || { echo "::error::only $pages page(s) rendered; the content tree did not come through"; exit 1; }
          {
            echo "### Default site rendered"
            echo
            echo "- $pages HTML files"
            echo "- content: \`$DOCRENDER_COMMIT_SUBJECT\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          # Same repository, so the built-in token is enough. This is the whole
          # reason the default site lives here rather than at a pretty address.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./site
          enable_jekyll: false
          commit_message: "render: default site from engine ${{ github.sha }}"
