name: Publish the default site

# WHY THIS EXISTS SEPARATELY FROM build.yml.
#
# build.yml is the app matrix: it renders each site and pushes the result into
# THAT site's own content repo, which is a cross-repository write and therefore
# needs a PAT a human has to mint. Until that secret exists the whole family is
# buildable and none of it is live, and "buildable" is not a claim anybody can
# check.
#
# The gold standard has to be LIVE, because that is the entire premise: a
# written specification rots, an executable one cannot. So the default instance
# publishes to THIS repository's own Pages, which the built-in GITHUB_TOKEN can
# do with no secret. If this URL is up and correct, the contract is true today.
#
# Real sites keep using build.yml, because they must live at their own address
# under their own name. The template does not need a pretty address; it needs
# to be undeniable.
#
# CONSEQUENCE, fixed 2026-08-03: this path publishes the template at a
# DIFFERENT address from the one build.yml would use, so the instance has two
# possible base URLs and site.yml can only state one. An address is therefore a
# property of the PUBLISHING PATH, not of the site, and it is passed in below.
# Left unfixed, the live site advertises a base_url pointing somewhere it is
# not, which poisons doc-index.json -- the one file other sites depend on.

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Same rhythm as the matrix. The content repo holds no workflow of its own
    # -- that is the purity rule -- so it cannot tell us it changed.
    - cron: "23 7 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

# Never two deployments at once, and never cancel one halfway: a half-published
# site is worse than a stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      DOCRENDER_INSTANCE: template
    steps:
      - name: Check out the engine
        uses: actions/checkout@v4
        with:
          path: engine

      - name: Check out the content
        uses: actions/checkout@v4
        with:
          # Was `maw-agents/template-docs` until 2026-08-03. Both repos were
          # transferred to this account and this line was missed. GitHub does
          # redirect a transferred path, so it would have kept working and kept
          # being wrong -- exactly the sort of quietly-stale pointer the
          # doc-rot sweep exists to catch.
          repository: mawizorek/template-docs
          path: content
          # Two commits so the build stamp can name the change it rendered.
          fetch-depth: 2

      # THE DESIGN SYSTEM, READ LIVE (2026-08-06). Same shape as build.yml and
      # publish.yml. Omitting it here would leave the one site whose premise is
      # "the spec is true by demonstration" demonstrating a snapshot.
      #
      # THE TOKEN FALLBACK IS LOAD-BEARING ON THIS PATH SPECIFICALLY. The whole
      # reason this workflow is separate is that the gold standard must be live
      # with NO secret -- see the header. Requiring DOCRENDER_TOKEN to fetch the
      # design system would quietly undo that, so this takes the built-in token
      # when there is no PAT.
      #
      # AND IF maw-themes EVER GOES PRIVATE, THIS IS THE PATH THAT FALLS BACK
      # FIRST AND QUIETEST -- the built-in token cannot read another private
      # repo, and nobody watches the template's build. The engine's report still
      # says so on the page's own build log.
      - name: Check out the canonical design system
        id: canonical
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: mawizorek/maw-themes
          path: canonical
          token: ${{ secrets.DOCRENDER_TOKEN || github.token }}

      - name: Configure Pages
        # `enablement: true` WAS SET HERE AND CANNOT WORK. Removed 2026-08-03
        # after it failed with:
        #
        #     Create Pages site failed. Error: Resource not accessible by
        #     integration
        #
        # `permissions: pages: write` grants the right to DEPLOY to a Pages site
        # that already exists. CREATING one is an administration-scoped call,
        # and the built-in GITHUB_TOKEN does not carry that on a personal repo
        # no matter what the workflow asks for. The flag is not a shortcut past
        # the setup click; it is a request that gets refused.
        #
        # So Pages must be turned on ONCE, by hand:
        #     Settings -> Pages -> Build and deployment -> Source: GitHub Actions
        # After that this step finds the site and reports its address below.
        #
        # If this step fails with `Get Pages site failed: Not Found`, that click
        # has not happened yet. It is a setup gap, not a build failure.
        id: pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - name: Install the renderer
        working-directory: engine
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Render
        env:
          DOCRENDER_CONTENT: ${{ github.workspace }}/content
          DOCRENDER_OUTPUT: ${{ github.workspace }}/site
          DOCRENDER_ENGINE_REF: ${{ github.sha }}
          # The address this particular path publishes to, discovered by
          # configure-pages rather than assumed. Overrides site.yml's base_url
          # for this build only -- see the CONSEQUENCE note at the top.
          DOCRENDER_BASE_URL: ${{ steps.pages.outputs.base_url }}
          # Points at the checkout above. No directory means the engine falls
          # back to the vendored copy and says so in the build report.
          DOCRENDER_CANONICAL: ${{ github.workspace }}/canonical
        run: |
          # EXPORTED INLINE, NOT VIA $GITHUB_ENV. Writing to $GITHUB_ENV only
          # affects LATER steps, never the step doing the writing -- so the
          # original version set these and then ran mkdocs in the same step
          # without them, and every page shipped stamped `local`.
          cd "${{ github.workspace }}/content"
          export DOCRENDER_COMMIT_SHA="$(git rev-parse HEAD)"
          export DOCRENDER_COMMIT_SUBJECT="$(git log -1 --pretty=%s)"
          cd "${{ github.workspace }}/engine"
          mkdocs build --config-file mkdocs.yml

      - name: Upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
