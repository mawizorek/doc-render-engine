name: Build and deploy doc sites

# THE APP MATRIX.
#
# One job per site. Each checks out the engine, one content repo and the
# canonical design system, renders, and pushes the result to THAT content
# repo's gh-pages branch.
#
# The detail that makes the whole design work: the green Download ZIP button
# zips the DEFAULT branch only. Built output on gh-pages therefore never
# pollutes the download, the content repo stays pure markdown, and the site
# still lives at its own pretty URL. No separate instance repos, no build
# artefacts in the tree a reader downloads.
#
# fail-fast is off on purpose. These sites have separate audiences and must
# fail separately; one broken build must never take the others down with it.
#
# EVERY ROW DECLARES ITS PUBLISHER, and that field is the whole reason this
# file and publish-default.yml can coexist without fighting:
#
#   publisher: matrix         this workflow pushes the built site into the
#                             content repo's gh-pages branch. Normal sites.
#   publisher: engine-pages   publish-default.yml puts it on THIS repo's own
#                             Pages instead. The default instance only.
#
# Two publishers for one site is how a site starts disagreeing with itself, so
# the field is a string rather than a boolean: `publishes_here: false` read
# ambiguously enough that the condition testing it was inverted, and the
# default instance was being published twice.
#
# AND AS OF 2026-08-04 THAT SAME FIELD ALSO DECIDES THE CHECKOUT TOKEN. See
# the long note on the content checkout below -- the short version is that
# `publisher: matrix` is exactly the set of repos whose PAT access is PROVEN by
# the deploy step, so it is the honest thing to key a read credential to.
#
# =============================================================================
# THIS FILE NO LONGER HOLDS A SCHEDULE (2026-08-04, same night it gained one)
# =============================================================================
# The routine lives in `poll.yml`, which does nothing but hold the cron and
# call this workflow. THE REASON IS THE OFF SWITCH: GitHub can disable a
# WORKFLOW from the Actions tab, and a disabled workflow shows a banner saying
# so -- but there is no way to disable one TRIGGER of a workflow that also
# handles pushes. Splitting the trigger into its own file is what makes
# "Disable workflow" mean exactly "stop the routine" and nothing else.
#
# `AUTOPUBLISH` IS GONE, one commit after it shipped, and the reason it was
# wrong is worth more than the variable was. It gated a schedule that still
# existed, so `off` did not mean "no routine" -- it meant "a routine that
# declines," which still burned a row in the Actions tab every five minutes and
# still left the live state invisible unless you opened Settings. Michael:
# "either auto-publish on a routine, or don't publish at all... I don't think
# we should have an 'on routine' and an 'off routine'." A disabled workflow IS
# the off state, it is legible on the screen you turn it back on from, and it
# cannot drift out of step with itself the way a variable a workflow must
# remember to read can.
#
# GENERALISABLE: when a toggle and the platform disagree about where state
# lives, the platform wins. A variable is a second copy of a fact GitHub is
# already tracking.
#
# STILL NOT GATED, and still deliberately: `publish.yml` is an explicit human
# act with a preview mode. Turning the routine off must never mean "I cannot
# publish."
#
# =============================================================================
# AND IT SHARES A DEPLOY QUEUE WITH publish.yml (2026-08-18)
# =============================================================================
# Running every five minutes makes this workflow the likeliest half of any
# collision on a content repo's `gh-pages` ref. The `concurrency:` block on the
# job below is what stops that; the full incident is written up there and in
# publish.yml. Read both before touching either group name.
#
# =============================================================================
# 🔴 A DEPLOY REPLACES THE WHOLE TREE, SO EVERY ARTIFACT MUST BE BUILT IN EVERY
#    WORKFLOW THAT DEPLOYS (2026-08-30)
# =============================================================================
# `peaceiris/actions-gh-pages` with `publish_dir: ./site` clones `gh-pages`,
# REPLACES its contents and pushes. So a file this workflow does not produce is
# not merely missing from this deploy -- it is DELETED from the live site.
#
# 🔴 THAT IS EXACTLY WHAT HAPPENED TO THE PROGRAM PACKET PDFs, WITHIN MINUTES.
# `bin/print-packets.py` shipped wired into `publish.yml` only, on the reasoning
# that a human publish is how the feature would be tested. Correct and
# insufficient: this routine fires every FIVE MINUTES, renders the same site with
# no print step, and its deploy took the PDFs off `gh-pages` while leaving
# `packets.json` in place -- because the manifest is written by `mkdocs build`
# and the PDFs are not.
#
# ⚡ SO THE SITE ADVERTISED FOUR PACKETS AND SERVED NONE, and the missing half
# was the half that took a browser to produce. Michael printed the HTML packet
# page instead and reported, correctly, that it comes out terribly.
#
# ⚑ GENERALISABLE, AND IT IS THE FILE-LEVEL TWIN OF THE FIVE-MINUTE RACE ABOVE:
# a periodic full-tree deploy makes every OTHER deploy path's extra artifacts
# temporary. Wiring a build step into one workflow is not shipping it -- the
# question is always "which workflows deploy this site," and here the answer has
# been two since 2026-08-04.
#
# ⚠️ AND THE HALF-STATE IS THE DANGEROUS PART, not the absence: a manifest that
# names artifacts nothing serves is worse than no manifest, because it reads as
# a working feature. If a future artifact is added to `publish.yml` and not to
# this file, that is the shape it will take.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      instance:
        description: Single instance to build (blank = all)
        required: false
        default: ""
  repository_dispatch:
    types: [content-changed]
  # Called by poll.yml. `secrets: inherit` there is what carries DOCRENDER_TOKEN
  # across the call -- a called workflow gets NO secrets by default, and the
  # symptom of forgetting it is not an error: HAS_DEPLOY_TOKEN resolves false,
  # every deploy is skipped, and the run summary politely reports a setup gap on
  # a green build.
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    # A HUNG JOB IS NOT A SLOW JOB, AND WITHOUT THIS LINE GITHUB CANNOT TELL
    # THE DIFFERENCE. The default ceiling is SIX HOURS, which is not a guardrail,
    # it is the absence of one.
    #
    # Found 2026-08-05: the `theatre` render HANGS rather than fails -- step 7
    # starts, never returns, and the job sat at six hours before GitHub killed
    # it. Two things went wrong downstream of that, and only the second one was
    # visible:
    #
    #   1. The routine kept working. uritp rendered and deployed in ~30 seconds
    #      on every single run, exactly as designed, because fail-fast is off.
    #   2. The RUN stayed amber for six hours anyway, because a run is only as
    #      finished as its slowest job -- so the Actions tab read as "the cron
    #      is stuck" when the cron was the one part that was fine.
    #
    # GENERALISABLE, and the real lesson: fail-fast: false isolates FAILURE
    # between matrix rows. It does not isolate TIME. One row that never returns
    # still holds the run open, still holds a runner, and still paints the whole
    # matrix with its own status. A per-job timeout is what actually buys the
    # independence the matrix was built for.
    #
    # TEN MINUTES WAS 20x THE OBSERVED CEILING, deliberately loose. Real
    # numbers on 2026-08-05: whole job ~30s, install ~12s, the slowest healthy
    # render (uritp) ~7s.
    #
    # ⚠️ RAISED 10 -> 15 ON 2026-08-30, and the old paragraph's reasoning is why
    # this needs saying rather than doing quietly: that number was justified as
    # unreachable on a working build, and the packet print step makes it
    # reachable. Chrome prints ONE sheet per launch, so `uritp-safety` with four
    # packets is a dozen browser launches on top of a 7-second render.
    # 🔴 MEASURED NOWHERE YET -- 15 is headroom, not evidence, and the first real
    # run is what should set it. Do not raise it again without reading a duration
    # off a run; the whole point of the paragraph above is that a timeout raised
    # on a hunch stops being a messenger.
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - instance: template
            repo: mawizorek/template-docs
            publisher: engine-pages
          - instance: uritp
            repo: mawizorek/uritp-docs
            publisher: matrix
          # ⚠️ A SECOND URITP SITE, AND IT IS NOT A DUPLICATE (2026-08-16).
          # `uritp` is the working tree where safety material is drafted;
          # `uritp-safety` is the published human-facing filter of it. Separate
          # audiences, separate repos, separate rows -- which is exactly what
          # fail-fast: false is for, since a broken draft site must never stop
          # the published one rendering.
          #
          # 🔴 ARRIVED BY TRANSFER, so DOCRENDER_TOKEN does not cover it until
          # somebody adds it by hand. A fine-grained PAT is scoped to an
          # explicit repository list and a transferred repo is never added
          # automatically -- the note on the content checkout below records the
          # `exit code 128` this produced on 2026-08-03, from this same cause.
          - instance: uritp-safety
            repo: mawizorek/uritp-safety
            publisher: matrix
          - instance: theatre
            repo: mawizorek/theatre-docs
            publisher: matrix
          - instance: hml
            repo: mawizorek/hml-docs
            publisher: matrix
    name: ${{ matrix.instance }}

    # =====================================================================
    # ONE DEPLOY AT A TIME PER SITE (2026-08-18)
    # =====================================================================
    # The deploy step clones the content repo's `gh-pages`, replaces the whole
    # tree, commits and pushes. If a second deploy lands on that ref between the
    # clone and the push, git refuses:
    #
    #   cannot lock ref 'refs/heads/gh-pages': is at X but expected Y
    #
    # ⚠️ The loser goes RED ON ITS LAST STEP having rendered a perfect site, so
    # it reads as a broken build when nothing is broken at all.
    #
    # This routine fires every five minutes, which makes it the likelier half of
    # any such collision. On 2026-08-18 it beat a deliberate human publish of
    # `uritp` by roughly two seconds — same engine SHA, same content SHA,
    # byte-identical output — and the human run took the error for work that had
    # already shipped.
    #
    # 🔴 THE GROUP NAME MUST STAY IDENTICAL TO publish.yml's. That one string is
    # the only thing making these two workflows share a queue: rename it here
    # and the race returns silently, with the symptom surfacing in the OTHER
    # file. Per-JOB rather than per-workflow, so the matrix still renders every
    # site in parallel and only same-site deploys serialise.
    #
    # `cancel-in-progress: false` is deliberate: a queued run waits instead of
    # killing whatever is mid-push.
    concurrency:
      group: gh-pages-${{ matrix.instance }}
      cancel-in-progress: false

    env:
      # A secret cannot be read inside an `if:`, so its presence is resolved
      # once, here, into something a step can test.
      HAS_DEPLOY_TOKEN: ${{ secrets.DOCRENDER_TOKEN != '' }}
    steps:
      - name: Check out the engine
        uses: actions/checkout@v4
        with:
          path: engine

      - name: Check out the content
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          path: content
          # AUTHENTICATED AS OF 2026-08-04, and the old comment is kept in
          # full below because its own warning came true within the hour.
          #
          # SUPERSEDED: "Deliberately NOT authenticated. The content repos are
          # public, and a token here buys nothing while adding a failure mode
          # that is genuinely hard to read: a fine-grained PAT missing this one
          # repo fails the CHECKOUT with `git ... exit code 128`, which looks
          # like a broken build rather than a missing checkbox. That cost a
          # debugging round on 2026-08-03, right after a repo transfer left it
          # off the token's list. If a content repo ever goes private, add
          # `token:` back HERE and expect that failure mode to return."
          #
          # `uritp-docs` went private on 2026-08-04, so that the repo page 404s
          # to anyone who swaps `github.io` for `github.com` while Pages keeps
          # serving `gh-pages` to the public. GITHUB_TOKEN is scoped to THIS
          # repository and cannot read another private one, so the checkout
          # died exactly as the paragraph above predicted it would.
          #
          # 🔴 AND IT PREDICTED `uritp-safety` TOO, ON 2026-08-16. That repo was
          # created and TRANSFERRED into this account, which is the precise
          # phrase in the struck comment above -- "right after a repo transfer
          # left it off the token's list." Third instance of one cause. If the
          # `uritp-safety` row fails at this step with exit 128, the repo is
          # missing from DOCRENDER_TOKEN and nothing about the build is wrong.
          #
          # ⚠️ FOURTH INSTANCE, DIFFERENT SHAPE, 2026-08-18: the `||` fallback
          # below means an EMPTY or WRONGLY-SCOPED secret does not fail loudly.
          # It hands the checkout `github.token`, which can only see THIS repo,
          # and the error becomes `remote: Write access to repository not
          # granted` + 403 -- which reads as a permission problem on the content
          # repo when the truth is DOCRENDER_TOKEN never arrived. Suspect the
          # SECRET before you audit the repo.
          #
          # WHY THIS IS KEYED TO `publisher` AND NOT TO A NEW `private` FLAG.
          # The `publisher: matrix` rows are precisely the repos this job
          # already WRITES to with DOCRENDER_TOKEN at the deploy step below --
          # so the PAT's read access to them is proven by a deploy that works,
          # not assumed from a checkbox nobody has looked at. `template` keeps
          # GITHUB_TOKEN, which is enough for a public repo, because nothing
          # here has ever demonstrated that the PAT can see `template-docs` and
          # taking that on faith is how the 128 arrived the first time. No new
          # field, no second list to forget, and the privacy of a content repo
          # is never stated twice.
          #
          # If `template-docs` ever goes private, this line is where it lands,
          # and the PAT must be given access BEFORE the visibility flips.
          token: ${{ matrix.publisher == 'matrix' && secrets.DOCRENDER_TOKEN || github.token }}
          # NO LONGER LOAD-BEARING (2026-08-04), old reason kept on the record.
          #
          # SUPERSEDED: "docrender/revlog.py reads `git log` here to build the
          # automatic revision log, and a shallow clone answers that query
          # without complaining -- it just returns the two commits it has, which
          # renders as a complete-looking log covering ten minutes."
          #
          # revlog.py makes no git call now; it renders the TSV each content repo
          # commits for itself. The trap MOVED to that repo's own revision-log
          # workflow, which pins fetch-depth: 0 for the reason quoted above.
          #
          # Kept because it costs seconds on a markdown repo and because this
          # setting must stay in step with publish.yml -- a depth that differs
          # between the two is the worst kind of inconsistency, correct when
          # published and broken on the nightly. Now a preference, not a
          # requirement, and if it is ever removed it must be removed from BOTH.
          fetch-depth: 0

      # =====================================================================
      # THE DESIGN SYSTEM, READ LIVE (2026-08-06)
      # =====================================================================
      # Michael: "the renderer should pull from canonical; there should be no
      # in-between." Until today the engine carried a VENDORED copy of the four
      # vectors and somebody had to re-copy it by hand -- so an edit upstream
      # painted nothing until a human noticed. It bit his own typography and
      # spacing edits on 08-05: fifty minutes live in the design system and
      # absent from every site.
      #
      # `continue-on-error` IS THE WHOLE FALLBACK MECHANISM, and it is the
      # second half of his ruling: "only fallback to local if the canonical in
      # themes repo cannot be reached during build." A failed fetch leaves no
      # directory, DOCRENDER_CANONICAL points at nothing, and vectors.py
      # renders the vendored snapshot with a loud line in the build report. The
      # step shows a red X while the job stays green -- visible, not fatal.
      #
      # IF maw-themes IS EVER PRIVATE, THE PAT NEEDS IT ADDED EXPLICITLY. A
      # fine-grained PAT is scoped to a list of repositories and a repo is never
      # added automatically -- the same trap that produced the `exit code 128`
      # documented in the content checkout above. The symptom here is softer and
      # therefore worse: no red build, just every site quietly painting the last
      # vendored copy. That is why the summary below names the source.
      #
      # NO fetch-depth PINNED. Nothing reads this repo's history -- only the
      # files at HEAD -- so the default shallow clone is correct and cheaper.
      - name: Check out the canonical design system
        id: canonical
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: mawizorek/maw-themes
          path: canonical
          token: ${{ secrets.DOCRENDER_TOKEN || github.token }}

      - name: Confirm the matrix agrees with the instance config
        working-directory: engine
        run: |
          declared=$(python3 -c "import yaml; print(yaml.safe_load(open('instances/${{ matrix.instance }}/site.yml'))['content_repo'])")
          if [ "$declared" != "${{ matrix.repo }}" ]; then
            echo "::error::matrix says ${{ matrix.repo }}, site.yml says $declared."
            echo "Two places name the content repo and they disagree. Fix one."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - name: Install the renderer
        working-directory: engine
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Render
        working-directory: engine
        env:
          DOCRENDER_INSTANCE: ${{ matrix.instance }}
          DOCRENDER_CONTENT: ${{ github.workspace }}/content
          DOCRENDER_OUTPUT: ${{ github.workspace }}/site
          DOCRENDER_ENGINE_REF: ${{ github.sha }}
          # Points at the checkout above. If that step failed there is no
          # directory here, and vectors.py falls back to theme/canonical/ and
          # says so. The variable is always set; its TARGET is what varies.
          DOCRENDER_CANONICAL: ${{ github.workspace }}/canonical
        run: |
          # EXPORTED INLINE, NOT VIA $GITHUB_ENV. Writing to $GITHUB_ENV only
          # affects LATER steps, never the step doing the writing -- so the
          # original version set these and then ran mkdocs in the same step
          # without them. Every page shipped stamped `local`, which is exactly
          # the "is this the latest push?" signal the stamp exists to give.
          # Found on the first live build, 2026-08-03.
          cd "${{ github.workspace }}/content"
          export DOCRENDER_COMMIT_SHA="$(git rev-parse HEAD)"
          export DOCRENDER_COMMIT_SUBJECT="$(git log -1 --pretty=%s)"
          cd "${{ github.workspace }}/engine"
          mkdocs build --config-file mkdocs.yml

      # =====================================================================
      # THE PROGRAM PACKETS (BUILD 10 v2, added here 2026-08-30)
      # =====================================================================
      # 🔴 THIS IS NOT A COPY OF A publish.yml STEP FOR TIDINESS. Without it this
      # workflow's deploy DELETES every packet PDF off `gh-pages` -- see the
      # full-tree-replacement note in the header. The manifest survives (mkdocs
      # writes it) and the PDFs do not, which is the half-state that made a live
      # site advertise four packets and serve none.
      #
      # 🔴 IT MUST SIT BETWEEN RENDER AND DEPLOY. It reads the FINISHED site off
      # disk and writes PDFs back into the same tree, so the deploy below ships
      # them. Earlier and the pages do not exist; later and the files miss the
      # boat.
      #
      # ⚠️ NO BROWSER INSTALL STEP, and the absence is deliberate: `ubuntu-latest`
      # ships Google Chrome, and the script hunts `google-chrome` before any
      # `chromium` because renderer identity is the entire premise. If GitHub ever
      # drops it from the image, THIS step fails loudly with the names it tried --
      # the correct failure, because the alternative is a green deploy that wipes
      # the PDFs again. 🚫 Do not "fix" that by letting it skip.
      #
      # ⚠️ A SITE WITH NO PACKETS IS A NO-OP, not a skip: the script exits 0 saying
      # `packets.json` is absent. Four of five rows are untouched, and an `if:`
      # guard here would be a second place stating which ones.
      #
      # ⚠️ AND IT RUNS EVEN WHEN THE DEPLOY WILL BE SKIPPED (no PAT, `template`,
      # a PR). That is deliberate: printing is the check. A PR that would break
      # the print path should go red here rather than on somebody's next publish.
      - name: Print the program packets
        working-directory: engine
        run: python bin/print-packets.py "${{ github.workspace }}/site"

      - name: Deploy to the content repo's gh-pages
        # Three conditions, each a real thing that goes wrong:
        #  - no PAT yet, so the cross-repo write dies confusingly
        #  - this row is published somewhere else (see the header)
        #  - a PR must never publish
        #
        # THERE IS NO LONGER A FOURTH. The AUTOPUBLISH condition that stood
        # here for one commit is gone with the variable; the routine is turned
        # off by disabling poll.yml. See the header.
        if: >-
          env.HAS_DEPLOY_TOKEN == 'true'
          && matrix.publisher == 'matrix'
          && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          # A fine-grained PAT with Contents: write on every content repo.
          # GITHUB_TOKEN cannot be used: it is scoped to THIS repo and the whole
          # job is writing to another one. A fine-grained PAT is also scoped to
          # ONE resource owner, which is why the whole family lives under one
          # account -- and a repo TRANSFERRED in after the token was minted is
          # not added to it automatically. See README section 6.
          personal_token: ${{ secrets.DOCRENDER_TOKEN }}
          external_repository: ${{ matrix.repo }}
          publish_branch: gh-pages
          publish_dir: ./site
          enable_jekyll: false
          commit_message: "render: ${{ matrix.instance }} from engine ${{ github.sha }}"

      - name: Say what happened to the built site
        # Silence is the enemy. A green build that published nothing looks
        # exactly like a green build that published everything, and the whole
        # point of the build stamp is that we refuse to guess about that.
        if: always()
        env:
          # Read into the shell rather than interpolated into it. A `${{ }}`
          # inside a quoted test is fine here, but the whole file already keeps
          # workflow values out of shell conditionals where it can.
          CANONICAL: ${{ steps.canonical.outcome }}
        run: |
          {
            echo "### ${{ matrix.instance }}"
            echo
            # THE DESIGN SYSTEM'S SOURCE, STATED ON EVERY RUN. A build that
            # fell back renders perfectly and looks identical to one that did
            # not -- it is simply painting an older palette. That is exactly
            # the silent failure this change removes, so it does not get to be
            # silent here either.
            if [ "$CANONICAL" = "success" ]; then
              echo "Theme: **live** from \`mawizorek/maw-themes\`."
            else
              echo "⚠️ **Theme: fell back to the vendored copy.** The design"
              echo "system could not be checked out, so this build painted"
              echo "\`theme/canonical/\` -- a snapshot that may be days old. Any"
              echo "upstream colour edit since the last re-vendor is NOT on this"
              echo "build. If \`maw-themes\` is private, add it to"
              echo "\`DOCRENDER_TOKEN\`."
            fi
            echo
            if [ "${{ matrix.publisher }}" = "engine-pages" ]; then
              echo "Rendered as a build check. This site is published by"
              echo "\`publish-default.yml\` to this repository's own Pages, not"
              echo "to \`${{ matrix.repo }}\`. Nothing was pushed from here, and"
              echo "that is correct."
            elif [ "$HAS_DEPLOY_TOKEN" != "true" ]; then
              echo "Rendered, NOT published: \`DOCRENDER_TOKEN\` is not set, so"
              echo "the write to \`${{ matrix.repo }}\` was skipped. A setup gap,"
              echo "not a build failure. See README section 6."
              echo
              echo "⚠️ If this run came from \`poll.yml\`, check that it calls"
              echo "this workflow with \`secrets: inherit\` -- a called workflow"
              echo "receives no secrets without it, and this is what that looks"
              echo "like."
            else
              echo "Published to \`${{ matrix.repo }}\` on \`gh-pages\`."
              echo
              echo "⚠️ The site is only reachable once Pages is set to deploy"
              echo "from the \`gh-pages\` branch on that repo. The first run"
              echo "CREATES the branch; the setting is a one-time click after."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
