name: Build and deploy doc sites

# THE APP MATRIX.
#
# One job per site. Each checks out the engine and one content repo, renders,
# and pushes the result to THAT content repo's gh-pages branch.
#
# The detail that makes the whole design work: the green Download ZIP button
# zips the DEFAULT branch only. Built output on gh-pages therefore never
# pollutes the download, the content repo stays pure markdown, and the site
# still lives at its own pretty URL. No separate instance repos, no build
# artefacts in the tree a reader downloads.
#
# fail-fast is off on purpose. These sites have separate audiences and must
# fail separately; one broken build must never take the others down with it.
#
# ⭐ EVERY ROW DECLARES ITS PUBLISHER, and that field is the whole reason this
# file and publish-default.yml can coexist without fighting:
#
#   publisher: matrix         this workflow pushes the built site into the
#                             content repo's gh-pages branch. Normal sites.
#   publisher: engine-pages   publish-default.yml puts it on THIS repo's own
#                             Pages instead. The default instance only.
#
# Two publishers for one site is how a site starts disagreeing with itself, so
# the field is a string rather than a boolean: `publishes_here: false` read
# ambiguously enough that the condition testing it was inverted, and the
# default instance was being published twice.
#
# ⭐ AND AS OF 2026-08-04 THAT SAME FIELD ALSO DECIDES THE CHECKOUT TOKEN. See
# the long note on the content checkout below -- the short version is that
# `publisher: matrix` is exactly the set of repos whose PAT access is PROVEN by
# the deploy step, so it is the honest thing to key a read credential to.
#
# =============================================================================
# ⭐ THIS FILE NO LONGER HOLDS A SCHEDULE (2026-08-04, same night it gained one)
# =============================================================================
# The routine lives in `poll.yml`, which does nothing but hold the cron and
# call this workflow. THE REASON IS THE OFF SWITCH: GitHub can disable a
# WORKFLOW from the Actions tab, and a disabled workflow shows a banner saying
# so -- but there is no way to disable one TRIGGER of a workflow that also
# handles pushes. Splitting the trigger into its own file is what makes
# "Disable workflow" mean exactly "stop the routine" and nothing else.
#
# 🪦 `AUTOPUBLISH` IS GONE, one commit after it shipped, and the reason it was
# wrong is worth more than the variable was. It gated a schedule that still
# existed, so `off` did not mean "no routine" -- it meant "a routine that
# declines," which still burned a row in the Actions tab every five minutes and
# still left the live state invisible unless you opened Settings. Michael:
# "either auto-publish on a routine, or don't publish at all... I don't think
# we should have an 'on routine' and an 'off routine'." A disabled workflow IS
# the off state, it is legible on the screen you turn it back on from, and it
# cannot drift out of step with itself the way a variable a workflow must
# remember to read can.
#
# ⚑ GENERALISABLE: when a toggle and the platform disagree about where state
# lives, the platform wins. A variable is a second copy of a fact GitHub is
# already tracking.
#
# 🚫 STILL NOT GATED, and still deliberately: `publish.yml` is an explicit human
# act with a preview mode. Turning the routine off must never mean "I cannot
# publish."

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      instance:
        description: Single instance to build (blank = all)
        required: false
        default: ""
  repository_dispatch:
    types: [content-changed]
  # Called by poll.yml. `secrets: inherit` there is what carries DOCRENDER_TOKEN
  # across the call -- a called workflow gets NO secrets by default, and the
  # symptom of forgetting it is not an error: HAS_DEPLOY_TOKEN resolves false,
  # every deploy is skipped, and the run summary politely reports a setup gap on
  # a green build.
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    # ⏱️ A HUNG JOB IS NOT A SLOW JOB, AND WITHOUT THIS LINE GITHUB CANNOT TELL
    # THE DIFFERENCE. The default ceiling is SIX HOURS, which is not a guardrail,
    # it is the absence of one.
    #
    # Found 2026-08-05: the `theatre` render HANGS rather than fails -- step 7
    # starts, never returns, and the job sat at six hours before GitHub killed
    # it. Two things went wrong downstream of that, and only the second one was
    # visible:
    #
    #   1. The routine kept working. uritp rendered and deployed in ~30 seconds
    #      on every single run, exactly as designed, because fail-fast is off.
    #   2. The RUN stayed amber for six hours anyway, because a run is only as
    #      finished as its slowest job -- so the Actions tab read as "the cron
    #      is stuck" when the cron was the one part that was fine.
    #
    # ⚑ GENERALISABLE, and the real lesson: fail-fast: false isolates FAILURE
    # between matrix rows. It does not isolate TIME. One row that never returns
    # still holds the run open, still holds a runner, and still paints the whole
    # matrix with its own status. A per-job timeout is what actually buys the
    # independence the matrix was built for.
    #
    # 📏 TEN MINUTES IS 20x THE OBSERVED CEILING, deliberately loose. Real
    # numbers on 2026-08-05: whole job ~30s, install ~12s, the slowest healthy
    # render (uritp) ~7s. This cannot fire on a working build; if it ever does,
    # something is wrong and the timeout is the messenger, not the cause.
    # Raise it only against measured evidence, never against a hunch that a
    # build "might need longer."
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
          - instance: template
            repo: mawizorek/template-docs
            publisher: engine-pages
          - instance: uritp
            repo: mawizorek/uritp-docs
            publisher: matrix
          - instance: theatre
            repo: mawizorek/theatre-docs
            publisher: matrix
          - instance: hml
            repo: mawizorek/hml-docs
            publisher: matrix
    name: ${{ matrix.instance }}
    env:
      # A secret cannot be read inside an `if:`, so its presence is resolved
      # once, here, into something a step can test.
      HAS_DEPLOY_TOKEN: ${{ secrets.DOCRENDER_TOKEN != '' }}
    steps:
      - name: Check out the engine
        uses: actions/checkout@v4
        with:
          path: engine

      - name: Check out the content
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          path: content
          # ⚠️ AUTHENTICATED AS OF 2026-08-04, and the old comment is kept in
          # full below because its own warning came true within the hour.
          #
          # SUPERSEDED: "Deliberately NOT authenticated. The content repos are
          # public, and a token here buys nothing while adding a failure mode
          # that is genuinely hard to read: a fine-grained PAT missing this one
          # repo fails the CHECKOUT with `git ... exit code 128`, which looks
          # like a broken build rather than a missing checkbox. That cost a
          # debugging round on 2026-08-03, right after a repo transfer left it
          # off the token's list. If a content repo ever goes private, add
          # `token:` back HERE and expect that failure mode to return."
          #
          # `uritp-docs` went private on 2026-08-04, so that the repo page 404s
          # to anyone who swaps `github.io` for `github.com` while Pages keeps
          # serving `gh-pages` to the public. GITHUB_TOKEN is scoped to THIS
          # repository and cannot read another private one, so the checkout
          # died exactly as the paragraph above predicted it would.
          #
          # ⭐ WHY THIS IS KEYED TO `publisher` AND NOT TO A NEW `private` FLAG.
          # The `publisher: matrix` rows are precisely the repos this job
          # already WRITES to with DOCRENDER_TOKEN at the deploy step below --
          # so the PAT's read access to them is proven by a deploy that works,
          # not assumed from a checkbox nobody has looked at. `template` keeps
          # GITHUB_TOKEN, which is enough for a public repo, because nothing
          # here has ever demonstrated that the PAT can see `template-docs` and
          # taking that on faith is how the 128 arrived the first time. No new
          # field, no second list to forget, and the privacy of a content repo
          # is never stated twice.
          #
          # If `template-docs` ever goes private, this line is where it lands,
          # and the PAT must be given access BEFORE the visibility flips.
          token: ${{ matrix.publisher == 'matrix' && secrets.DOCRENDER_TOKEN || github.token }}
          # ⚠️ NO LONGER LOAD-BEARING (2026-08-04), old reason kept on the record.
          #
          # SUPERSEDED: "docrender/revlog.py reads `git log` here to build the
          # automatic revision log, and a shallow clone answers that query
          # without complaining -- it just returns the two commits it has, which
          # renders as a complete-looking log covering ten minutes."
          #
          # revlog.py makes no git call now; it renders the TSV each content repo
          # commits for itself. The trap MOVED to that repo's own revision-log
          # workflow, which pins fetch-depth: 0 for the reason quoted above.
          #
          # Kept because it costs seconds on a markdown repo and because this
          # setting must stay in step with publish.yml -- a depth that differs
          # between the two is the worst kind of inconsistency, correct when
          # published and broken on the nightly. Now a preference, not a
          # requirement, and if it is ever removed it must be removed from BOTH.
          fetch-depth: 0

      - name: Confirm the matrix agrees with the instance config
        working-directory: engine
        run: |
          declared=$(python3 -c "import yaml; print(yaml.safe_load(open('instances/${{ matrix.instance }}/site.yml'))['content_repo'])")
          if [ "$declared" != "${{ matrix.repo }}" ]; then
            echo "::error::matrix says ${{ matrix.repo }}, site.yml says $declared."
            echo "Two places name the content repo and they disagree. Fix one."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - name: Install the renderer
        working-directory: engine
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Render
        working-directory: engine
        env:
          DOCRENDER_INSTANCE: ${{ matrix.instance }}
          DOCRENDER_CONTENT: ${{ github.workspace }}/content
          DOCRENDER_OUTPUT: ${{ github.workspace }}/site
          DOCRENDER_ENGINE_REF: ${{ github.sha }}
        run: |
          # ⚠️ EXPORTED INLINE, NOT VIA $GITHUB_ENV. Writing to $GITHUB_ENV only
          # affects LATER steps, never the step doing the writing -- so the
          # original version set these and then ran mkdocs in the same step
          # without them. Every page shipped stamped `local`, which is exactly
          # the "is this the latest push?" signal the stamp exists to give.
          # Found on the first live build, 2026-08-03.
          cd "${{ github.workspace }}/content"
          export DOCRENDER_COMMIT_SHA="$(git rev-parse HEAD)"
          export DOCRENDER_COMMIT_SUBJECT="$(git log -1 --pretty=%s)"
          cd "${{ github.workspace }}/engine"
          mkdocs build --config-file mkdocs.yml

      - name: Deploy to the content repo's gh-pages
        # Three conditions, each a real thing that goes wrong:
        #  - no PAT yet, so the cross-repo write dies confusingly
        #  - this row is published somewhere else (see the header)
        #  - a PR must never publish
        #
        # ⚠️ THERE IS NO LONGER A FOURTH. The AUTOPUBLISH condition that stood
        # here for one commit is gone with the variable; the routine is turned
        # off by disabling poll.yml. See the header.
        if: >-
          env.HAS_DEPLOY_TOKEN == 'true'
          && matrix.publisher == 'matrix'
          && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          # A fine-grained PAT with Contents: write on every content repo.
          # GITHUB_TOKEN cannot be used: it is scoped to THIS repo and the whole
          # job is writing to another one. A fine-grained PAT is also scoped to
          # ONE resource owner, which is why the whole family lives under one
          # account -- and a repo TRANSFERRED in after the token was minted is
          # not added to it automatically. See README section 6.
          personal_token: ${{ secrets.DOCRENDER_TOKEN }}
          external_repository: ${{ matrix.repo }}
          publish_branch: gh-pages
          publish_dir: ./site
          enable_jekyll: false
          commit_message: "render: ${{ matrix.instance }} from engine ${{ github.sha }}"

      - name: Say what happened to the built site
        # Silence is the enemy. A green build that published nothing looks
        # exactly like a green build that published everything, and the whole
        # point of the build stamp is that we refuse to guess about that.
        if: always()
        run: |
          {
            echo "### ${{ matrix.instance }}"
            echo
            if [ "${{ matrix.publisher }}" = "engine-pages" ]; then
              echo "Rendered as a build check. This site is published by"
              echo "\`publish-default.yml\` to this repository's own Pages, not"
              echo "to \`${{ matrix.repo }}\`. Nothing was pushed from here, and"
              echo "that is correct."
            elif [ "$HAS_DEPLOY_TOKEN" != "true" ]; then
              echo "Rendered, NOT published: \`DOCRENDER_TOKEN\` is not set, so"
              echo "the write to \`${{ matrix.repo }}\` was skipped. A setup gap,"
              echo "not a build failure. See README section 6."
              echo
              echo "⚠️ If this run came from \`poll.yml\`, check that it calls"
              echo "this workflow with \`secrets: inherit\` -- a called workflow"
              echo "receives no secrets without it, and this is what that looks"
              echo "like."
            else
              echo "Published to \`${{ matrix.repo }}\` on \`gh-pages\`."
              echo
              echo "⚠️ The site is only reachable once Pages is set to deploy"
              echo "from the \`gh-pages\` branch on that repo. The first run"
              echo "CREATES the branch; the setting is a one-time click after."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
