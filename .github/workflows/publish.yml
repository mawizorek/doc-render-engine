name: Publish a site

# THE PUBLISH BUTTON.
#
# Pick a site, choose Preview or Publish, run it. That is the whole interface,
# and it is deliberately a different thing from build.yml.
#
#   build.yml    fires on every engine change and rebuilds EVERYTHING. It is
#                the engine's own regression check: did my change break a site.
#   publish.yml  is ONE site, on purpose, when its content is ready -- the
#                closest thing this family has to 'make THIS public, now'.
#

run-name: >-
  ${{ inputs.site }} · ${{ inputs.mode }}${{ inputs.theme != '' && format(' · theme: {0}', inputs.theme) || '' }}${{ inputs.note != '' && format(' · {0}', inputs.note) || '' }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preview shows the diff and deploys nothing
        required: true
        default: publish
        type: choice
        options:
          - publish
          - preview
      site:
        description: Which site
        required: true
        type: choice
        default: uritp
        options:
          - theatre
          - hml
          - template
          - uritp
          - prose
      theme:
        # Optional on purpose, and `string` on purpose -- see THE `theme` INPUT
        # at the top of this file for why a dropdown would be a fourth copy of
        # a union this file cannot see.
        description: "(opt) For THIS build only."
        required: false
        default: ""
        type: string
      note:
        # Optional on purpose -- see THE `note` INPUT at the top of this file.
        description: "Shows in the run title and the deploy commit."
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    name: ${{ inputs.site }} (${{ inputs.mode }})

    # Matches build.yml deliberately. A hung render holds a runner for SIX
    # HOURS on the default ceiling, and the `theatre` render is known to hang
    # rather than fail (build.yml, 2026-08-05). Ten minutes is ~20x the observed
    # worst case; if it ever fires, it is the messenger.
    timeout-minutes: 10

    steps:
      - name: Check out the engine
        uses: actions/checkout@v4
        with:
          # EXPLICITLY `main`, not the triggering SHA. See the RE-RUN note at
          # the top of this file: without it, re-running an old run publishes
          # an old engine over a newer build and looks completely healthy.
          ref: main
          path: engine

      - name: Note which engine is actually building this
        id: engine
        working-directory: engine
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve the site
        id: site
        working-directory: engine
        # The content repo is NOT restated here. It is read from the instance's
        # own site.yml, which is the file that already had to be correct for
        # anything to build. The old version carried a `case` statement naming
        # every repo a second time, which meant a new site could be added to
        # the dropdown and still fail on a missing branch of a switch nobody
        # remembered existed.
        run: |
          slug="${{ inputs.site }}"
          if [ ! -f "instances/$slug/site.yml" ]; then
            echo "::error::no instance '$slug'. Known instances:"
            ls -1 instances >&2
            exit 1
          fi
          repo=$(python3 -c "import yaml,sys; print(yaml.safe_load(open('instances/$slug/site.yml'))['content_repo'])")
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "Publishing \`$slug\` from \`$repo\`." >> "$GITHUB_STEP_SUMMARY"

      - name: State the reason, if one was given
        # Printed as its own step so it is visible in the step LIST, not only
        # inside a log nobody expands. A publish with no stated reason says so
        # rather than printing nothing -- silence would read as a missing step.
        env:
          NOTE: ${{ inputs.note }}
        run: |
          if [ -n "$NOTE" ]; then
            echo "Reason given: $NOTE"
            {
              echo ""
              echo "> **Why:** $NOTE"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No reason given. That is allowed; the field is optional."
          fi

      - name: State the theme override, if one was given
        # Same shape as the step above, and separate from it for the same
        # reason: a step that does not appear did not run, and a reader
        # scanning the step LIST should be able to see at a glance whether this
        # build is wearing its own look or a borrowed one.
        #
        # ⚠️ THIS STEP ONLY ECHOES WHAT WAS ASKED FOR. It cannot validate the
        # name -- the legal set is resolved live from maw-themes and is not
        # readable here -- and on `random` it cannot know the roll. The ENGINE
        # is the authority on both and reports them from the render step.
        env:
          THEME: ${{ inputs.theme }}
        run: |
          if [ -n "$THEME" ]; then
            echo "Theme override requested: $THEME"
            {
              echo ""
              echo "> **Theme for this build only:** \`$THEME\` — requested at"
              echo "> dispatch. \`site.yml\` is not edited. The engine confirms"
              echo "> the theme it actually used in a notice at the top of this"
              echo "> run, which is the line to read if you asked for \`random\`"
              echo "> or if the name was rejected."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No theme override. This site renders the theme its site.yml declares."
          fi

      - name: Check out the content
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.site.outputs.repo }}
          ref: main
          path: content
          # AUTHENTICATED AS OF 2026-08-04, for the same reason as build.yml
          # and with the same shape, so the two files cannot drift.
          #
          # `uritp-docs` went private on 2026-08-04 so that the repo page 404s
          # to anyone who swaps `github.io` for `github.com`, while Pages keeps
          # serving `gh-pages` publicly. GITHUB_TOKEN is scoped to THIS
          # repository, so an unauthenticated checkout of a private content
          # repo dies with `exit code 128` -- which reads as a broken build
          # rather than a missing credential, and build.yml carried a written
          # prediction of exactly that failure long before it happened.
          #
          # THE CONDITION MIRRORS THE DEPLOY STEP'S OWN, deliberately, rather
          # than inventing a second rule about privacy. Every site this workflow
          # can actually publish is written to with this PAT below, so the PAT's
          # read access to it is proven rather than assumed. `template` is the
          # one exception in both places: it deploys from publish-default.yml
          # and never from here, so nothing has ever demonstrated the PAT can
          # see `template-docs`, and it stays on GITHUB_TOKEN -- which is all a
          # public repo needs. One exception, stated the same way twice, so a
          # reader of either line finds the other.
          token: ${{ inputs.site != 'template' && secrets.DOCRENDER_TOKEN || github.token }}
          # NO LONGER LOAD-BEARING, AND THE OLD REASON IS RECORDED RATHER
          # THAN DELETED (2026-08-04).
          #
          # SUPERSEDED: "docrender/revlog.py builds the automatic revision log
          # by reading `git log` out of this checkout, and a shallow clone
          # answers that query without complaining -- it returns the handful of
          # commits it happens to have, which renders as a complete-looking
          # history covering an afternoon."
          #
          # That is no longer how the log is built. revlog.py now renders the
          # TSV the content repo commits for itself, and makes NO git call at
          # all, so nothing in the engine breaks at depth 1. The shallow-clone
          # trap did not go away -- it MOVED to the content repo's own
          # revision-log workflow, which pins fetch-depth: 0 for exactly the
          # reason quoted above.
          #
          # Kept anyway, deliberately: a full clone of a markdown repo costs
          # seconds, and a publish that holds real history is the cheaper place
          # to be if any stage ever wants it again. Anyone removing it should
          # know it is now a preference, not a requirement.
          fetch-depth: 0

      # THE DESIGN SYSTEM, READ LIVE (2026-08-06). Same shape as build.yml, and
      # see the note at the top of this file for why this path is the one where
      # a silent fallback does the most damage.
      #
      # `continue-on-error` is the fallback mechanism: no directory means
      # vectors.py renders theme/canonical/ and says so in the build report.
      # The step shows a red X while the job stays green.
      #
      # PREVIEW MODE IS WHERE THIS PAYS. A fallback caught during a preview
      # costs nothing; the same fallback on `publish` has already put an old
      # palette on the live site by the time anybody reads the summary.
      #
      # ⚠️ AND IT IS WHAT MAKES THE `theme` INPUT WORTH ANYTHING. The legal
      # theme names are read from this checkout. If it fails, the union shrinks
      # to the vendored copy plus the four local skins, so a canonical theme
      # that exists upstream can be REJECTED as unknown -- with the fallback
      # warning already printed above it, which is the line that explains why.
      - name: Check out the canonical design system
        id: canonical
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: mawizorek/maw-themes
          path: canonical
          token: ${{ secrets.DOCRENDER_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - name: Install the renderer
        working-directory: engine
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Render and report
        working-directory: engine
        env:
          DOCRENDER_INSTANCE: ${{ inputs.site }}
          DOCRENDER_CONTENT: ${{ github.workspace }}/content
          DOCRENDER_OUTPUT: ${{ github.workspace }}/site
          DOCRENDER_ENGINE_REF: ${{ steps.engine.outputs.sha }}
          DOCRENDER_DRY_RUN: ${{ inputs.mode == 'preview' && '1' || '0' }}
          # Points at the checkout above. If that step failed there is no
          # directory here, and the engine falls back to the vendored copy and
          # reports it. The variable is always set; its TARGET is what varies.
          DOCRENDER_CANONICAL: ${{ github.workspace }}/canonical
          # THE THEME OVERRIDE, AND AN EMPTY VALUE IS A NO-OP BY CONTRACT.
          # instance._theme_override returns immediately on an empty string, so
          # setting this unconditionally is safe and is the same shape as
          # DOCRENDER_CANONICAL above: always set, the VALUE is what varies.
          DOCRENDER_THEME: ${{ inputs.theme }}
        run: |
          # Exported inline: $GITHUB_ENV only reaches LATER steps, so setting
          # these and running mkdocs in the same step would leave the build
          # stamp reading `unstamped`.
          cd "${{ github.workspace }}/content"
          export DOCRENDER_COMMIT_SHA="$(git rev-parse HEAD)"
          export DOCRENDER_COMMIT_SUBJECT="$(git log -1 --pretty=%s)"
          cd "${{ github.workspace }}/engine"
          mkdocs build --config-file mkdocs.yml

      - name: Deploy
        if: inputs.mode == 'publish' && inputs.site != 'template'
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.DOCRENDER_TOKEN }}
          external_repository: ${{ steps.site.outputs.repo }}
          publish_branch: gh-pages
          publish_dir: ./site
          enable_jekyll: false
          # THE NOTE'S DURABLE HOME. Actions logs age out of retention; a
          # commit in the content repo does not. If the reason for a publish is
          # ever going to be read six months from now, it is read here.
          #
          # ⚠️ THE THEME RIDES ALONG FOR A SHARPER REASON THAN THE NOTE DOES
          # (2026-08-07): a themed publish leaves a live site that does not
          # match its own site.yml, and this commit is the ONLY durable record
          # of why. Without it, the next person to open the site and the file
          # together finds a contradiction with no explanation. It records what
          # was ASKED FOR -- on `random` the engine's notice names the roll.
          commit_message: "publish: ${{ inputs.site }} from engine ${{ steps.engine.outputs.sha }}${{ inputs.theme != '' && format(' · theme: {0}', inputs.theme) || '' }}${{ inputs.note != '' && format(' · {0}', inputs.note) || '' }}"

      - name: What happens next
        if: always()
        env:
          CANONICAL: ${{ steps.canonical.outcome }}
        run: |
          {
            echo ""
            echo "---"
            echo "Built with engine \`${{ steps.engine.outputs.sha }}\` (main)."
            echo ""
            # WHICH DESIGN SYSTEM PAINTED THIS. On a preview this is the line
            # that tells you whether what you are about to look at reflects the
            # colour edit you just made.
            if [ "$CANONICAL" = "success" ]; then
              echo "Theme: **live** from \`mawizorek/maw-themes\`."
            else
              echo "⚠️ **Theme: fell back to the vendored copy.** The design"
              echo "system could not be checked out, so this build painted"
              echo "\`theme/canonical/\` -- a snapshot that may be days old. If"
              echo "you are here to check a colour change, THIS BUILD DOES NOT"
              echo "CONTAIN IT. If \`maw-themes\` is private, add it to"
              echo "\`DOCRENDER_TOKEN\`."
            fi
            echo ""
            if [ "${{ inputs.mode }}" = "preview" ]; then
              echo "**Nothing was deployed.** This was a preview. Run again with"
              echo "mode \`publish\` to push the diff above to the live site."
            elif [ "${{ inputs.site }}" = "template" ]; then
              echo "**Nothing was deployed from here.** The template publishes"
              echo "from \`publish-default.yml\` to this repo's own Pages."
            else
              echo "**Published.** Live in about a minute at the URL above."
              echo "The footer stamp on the site is how you confirm it landed:"
              echo "if it does not name this run, the deploy did not take."
            fi
            # A THEMED PUBLISH LEAVES THE SITE DISAGREEING WITH ITS OWN CONFIG,
            # so the run that did it says how to undo it. One sentence, only
            # when it applies, and only when something was actually deployed.
            if [ -n "${{ inputs.theme }}" ] && [ "${{ inputs.mode }}" = "publish" ]; then
              echo ""
              echo "⚠️ **This publish wore a theme override.** The live site is"
              echo "not rendering what its \`site.yml\` declares. Nothing was"
              echo "written to disk, so publishing again with an empty **theme**"
              echo "box puts it back -- there is no file to revert."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
