name: Publish a site

# ⭐ THE PUBLISH BUTTON.
#
# Pick a site, choose Preview or Publish, run it. That is the whole interface,
# and it is deliberately a different thing from build.yml.
#
#   build.yml    fires on every engine change and rebuilds EVERYTHING. It is
#                the engine's own regression check: did my change break a site.
#   publish.yml  is the editorial act. ONE site, on purpose, when its content
#                is ready. It is the closest thing this family has to 'make
#                this public', and it is a decision rather than a side effect.
#
# WHY IT IS NOT AUTOMATIC ON CONTENT PUSH. Publishing is an editorial decision:
# an unfinished page can sit in `main` for a week without a reader ever seeing
# it, and going live is something somebody chooses.
#
# ⚠️ THE OLD SECOND HALF OF THAT ARGUMENT IS NO LONGER TRUE (2026-08-04). It used
# to read "a content repo holds no workflow -- that is the purity rule -- so it
# CANNOT publish itself." `uritp-docs` now holds exactly one workflow, by
# Michael's explicit exception, which regenerates its revision-log TSV on every
# doc commit. So auto-publish became POSSIBLE on the day this comment stopped
# being a fact, and the reason it is still not done is the editorial one above,
# which stands on its own. Recorded rather than quietly rewritten, because
# "impossible" and "chosen against" are different arguments and only one of them
# survives contact with a new workflow.
#
# PREVIEW MODE renders the site, diffs it against what is actually being
# served, prints new / disappearing / renamed pages to the run summary, and
# deploys NOTHING. Run it before every publish.
#
# =============================================================================
# ⚠️ THE SITE LIST BELOW IS HAND-MAINTAINED, AND IT CANNOT BE OTHERWISE
# =============================================================================
# `workflow_dispatch` inputs are read out of THIS FILE on the default branch
# before any job starts, so a `type: choice` list cannot be computed. There is
# no step that runs early enough to fill it in. Every other list of sites in
# this repo is derived from `instances/*/site.yml`; this one is the exception,
# and it is a platform limit rather than a decision.
#
# So it WILL be forgotten. It already was: `hml` was added as an instance and
# wired into build.yml on 2026-08-03 and this dropdown was not touched, which
# left a site that builds and cannot be published -- visible only to whoever
# next opened the dropdown looking for it.
#
# Adding a site is therefore THREE edits, not two:
#   1. instances/<slug>/site.yml   (the site itself)
#   2. build.yml matrix row        (the all-sites regression build)
#   3. the options list here       (the publish button)
# The `Resolve the site` step below no longer duplicates the content repo --
# that comes from site.yml -- so the slug is the only thing stated twice.
#
# =============================================================================
# ⚠️ RE-RUN IS NOT THE SAME AS RUN (fixed 2026-08-03)
# =============================================================================
# GitHub's "Re-run jobs" button replays a run AT ITS ORIGINAL COMMIT. For a
# workflow that builds a site out of THIS repository, that means re-running an
# earlier publish rebuilds the site with an OLD ENGINE -- and because deploys
# are last-writer-wins, it silently overwrites a newer, correct build.
#
# It happened for real: three consecutive publishes all shipped engine 74ee551
# while HEAD was cf35bda, each one stamping over a good build. The symptom is
# the worst kind available -- a green run, a fresh timestamp, and none of your
# changes on the page.
#
# Two defences below. The engine checkout is pinned to `main` EXPLICITLY rather
# than to the triggering SHA, and the run summary prints the engine commit it
# actually used, so a stale build is visible instead of inferred.

on:
  workflow_dispatch:
    inputs:
      site:
        description: Which site
        required: true
        type: choice
        options:
          - uritp
          - theatre
          - hml
          - template
      mode:
        description: Preview shows the diff and deploys nothing
        required: true
        default: preview
        type: choice
        options:
          - preview
          - publish

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    name: ${{ inputs.site }} (${{ inputs.mode }})
    steps:
      - name: Check out the engine
        uses: actions/checkout@v4
        with:
          # EXPLICITLY `main`, not the triggering SHA. See the RE-RUN note at
          # the top of this file: without it, re-running an old run publishes
          # an old engine over a newer build and looks completely healthy.
          ref: main
          path: engine

      - name: Note which engine is actually building this
        id: engine
        working-directory: engine
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve the site
        id: site
        working-directory: engine
        # The content repo is NOT restated here. It is read from the instance's
        # own site.yml, which is the file that already had to be correct for
        # anything to build. The old version carried a `case` statement naming
        # every repo a second time, which meant a new site could be added to
        # the dropdown and still fail on a missing branch of a switch nobody
        # remembered existed.
        run: |
          slug="${{ inputs.site }}"
          if [ ! -f "instances/$slug/site.yml" ]; then
            echo "::error::no instance '$slug'. Known instances:"
            ls -1 instances >&2
            exit 1
          fi
          repo=$(python3 -c "import yaml,sys; print(yaml.safe_load(open('instances/$slug/site.yml'))['content_repo'])")
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "Publishing \`$slug\` from \`$repo\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Check out the content
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.site.outputs.repo }}
          ref: main
          path: content
          # ⚠️ AUTHENTICATED AS OF 2026-08-04, for the same reason as build.yml
          # and with the same shape, so the two files cannot drift.
          #
          # `uritp-docs` went private on 2026-08-04 so that the repo page 404s
          # to anyone who swaps `github.io` for `github.com`, while Pages keeps
          # serving `gh-pages` publicly. GITHUB_TOKEN is scoped to THIS
          # repository, so an unauthenticated checkout of a private content
          # repo dies with `exit code 128` -- which reads as a broken build
          # rather than a missing credential, and build.yml carried a written
          # prediction of exactly that failure long before it happened.
          #
          # ⭐ THE CONDITION MIRRORS THE DEPLOY STEP'S OWN, deliberately, rather
          # than inventing a second rule about privacy. Every site this workflow
          # can actually publish is written to with this PAT below, so the PAT's
          # read access to it is proven rather than assumed. `template` is the
          # one exception in both places: it deploys from publish-default.yml
          # and never from here, so nothing has ever demonstrated the PAT can
          # see `template-docs`, and it stays on GITHUB_TOKEN -- which is all a
          # public repo needs. One exception, stated the same way twice, so a
          # reader of either line finds the other.
          token: ${{ inputs.site != 'template' && secrets.DOCRENDER_TOKEN || github.token }}
          # ⚠️ NO LONGER LOAD-BEARING, AND THE OLD REASON IS RECORDED RATHER
          # THAN DELETED (2026-08-04).
          #
          # SUPERSEDED: "docrender/revlog.py builds the automatic revision log
          # by reading `git log` out of this checkout, and a shallow clone
          # answers that query without complaining -- it returns the handful of
          # commits it happens to have, which renders as a complete-looking
          # history covering an afternoon."
          #
          # That is no longer how the log is built. revlog.py now renders the
          # TSV the content repo commits for itself, and makes NO git call at
          # all, so nothing in the engine breaks at depth 1. The shallow-clone
          # trap did not go away -- it MOVED to the content repo's own
          # revision-log workflow, which pins fetch-depth: 0 for exactly the
          # reason quoted above.
          #
          # Kept anyway, deliberately: a full clone of a markdown repo costs
          # seconds, and a publish that holds real history is the cheaper place
          # to be if any stage ever wants it again. Anyone removing it should
          # know it is now a preference, not a requirement.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - name: Install the renderer
        working-directory: engine
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Render and report
        working-directory: engine
        env:
          DOCRENDER_INSTANCE: ${{ inputs.site }}
          DOCRENDER_CONTENT: ${{ github.workspace }}/content
          DOCRENDER_OUTPUT: ${{ github.workspace }}/site
          DOCRENDER_ENGINE_REF: ${{ steps.engine.outputs.sha }}
          DOCRENDER_DRY_RUN: ${{ inputs.mode == 'preview' && '1' || '0' }}
        run: |
          # Exported inline: $GITHUB_ENV only reaches LATER steps, so setting
          # these and running mkdocs in the same step would leave the build
          # stamp reading `unstamped`.
          cd "${{ github.workspace }}/content"
          export DOCRENDER_COMMIT_SHA="$(git rev-parse HEAD)"
          export DOCRENDER_COMMIT_SUBJECT="$(git log -1 --pretty=%s)"
          cd "${{ github.workspace }}/engine"
          mkdocs build --config-file mkdocs.yml

      - name: Deploy
        if: inputs.mode == 'publish' && inputs.site != 'template'
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.DOCRENDER_TOKEN }}
          external_repository: ${{ steps.site.outputs.repo }}
          publish_branch: gh-pages
          publish_dir: ./site
          enable_jekyll: false
          commit_message: "publish: ${{ inputs.site }} from engine ${{ steps.engine.outputs.sha }}"

      - name: What happens next
        if: always()
        run: |
          {
            echo ""
            echo "---"
            echo "Built with engine \`${{ steps.engine.outputs.sha }}\` (main)."
            echo ""
            if [ "${{ inputs.mode }}" = "preview" ]; then
              echo "**Nothing was deployed.** This was a preview. Run again with"
              echo "mode \`publish\` to push the diff above to the live site."
            elif [ "${{ inputs.site }}" = "template" ]; then
              echo "**Nothing was deployed from here.** The template publishes"
              echo "from \`publish-default.yml\` to this repo's own Pages."
            else
              echo "**Published.** Live in about a minute at the URL above."
              echo "The footer stamp on the site is how you confirm it landed:"
              echo "if it does not name this run, the deploy did not take."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
