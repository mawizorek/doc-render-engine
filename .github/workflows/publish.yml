name: Publish a site

# THE PUBLISH BUTTON. One site, on purpose, when its content is ready.
# Rationale, traps and superseded reasoning: ./README.md § publish.yml

run-name: >-
  ${{ inputs.site }} · ${{ inputs.mode }}${{ inputs.theme != '' && format(' · theme: {0}', inputs.theme) || '' }}${{ inputs.note != '' && format(' · {0}', inputs.note) || '' }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preview shows the diff and deploys nothing
        required: true
        default: publish
        type: choice
        options:
          - publish
          - preview
      site:
        # ⚠️ HAND-MAINTAINED, and the only site list in the family that is not
        # derived. Adding an instance is TWO edits: instances/<slug>/ AND this
        # list. `hml` shipped unpublishable for two days on one of them.
        # README § The `site` dropdown
        description: Which site
        required: true
        type: choice
        default: uritp
        options:
          - theatre
          - hml
          - template
          - uritp
          - prose
      theme:
        # `string`, not a dropdown — README § The `theme` input
        description: "(opt) For THIS build only."
        required: false
        default: ""
        type: string
      note:
        # README § The `note` input
        description: "Shows in the run title and the deploy commit."
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    name: ${{ inputs.site }} (${{ inputs.mode }})

    # Matches build.yml. A hung render holds a runner 6h on the default.
    # README § timeout-minutes
    timeout-minutes: 10

    steps:
      - name: Check out the engine
        uses: actions/checkout@v4
        with:
          # ⚠️ EXPLICITLY main, not the triggering SHA. Otherwise re-running an
          # old run publishes an old engine and looks healthy.
          # README § Checkout pins main
          ref: main
          path: engine

      - name: Note which engine is actually building this
        id: engine
        working-directory: engine
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve the site
        id: site
        working-directory: engine
        # The content repo is read from the instance's site.yml, never restated
        # here. README § The content repo is NOT restated
        run: |
          slug="${{ inputs.site }}"
          if [ ! -f "instances/$slug/site.yml" ]; then
            echo "::error::no instance '$slug'. Known instances:"
            ls -1 instances >&2
            exit 1
          fi
          repo=$(python3 -c "import yaml,sys; print(yaml.safe_load(open('instances/$slug/site.yml'))['content_repo'])")
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "Publishing \`$slug\` from \`$repo\`." >> "$GITHUB_STEP_SUMMARY"

      - name: State the reason, if one was given
        # Own step so it shows in the step LIST, not a collapsed log.
        # README § The reporting steps are separate on purpose
        env:
          NOTE: ${{ inputs.note }}
        run: |
          if [ -n "$NOTE" ]; then
            echo "Reason given: $NOTE"
            {
              echo ""
              echo "> **Why:** $NOTE"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No reason given. That is allowed; the field is optional."
          fi

      - name: State the theme override, if one was given
        # ⚠️ ECHOES ONLY. It cannot validate the name and cannot know a `random`
        # roll; the engine reports both from the render step.
        env:
          THEME: ${{ inputs.theme }}
        run: |
          if [ -n "$THEME" ]; then
            echo "Theme override requested: $THEME"
            {
              echo ""
              echo "> **Theme for this build only:** \`$THEME\` — requested at"
              echo "> dispatch. \`site.yml\` is not edited. The engine confirms"
              echo "> the theme it actually used in a notice at the top of this"
              echo "> run, which is the line to read if you asked for \`random\`"
              echo "> or if the name was rejected."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No theme override. This site renders the theme its site.yml declares."
          fi

      - name: Check out the content
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.site.outputs.repo }}
          ref: main
          path: content
          # ⚠️ AUTHENTICATED. A private content repo dies at exit 128 on an
          # unauthenticated checkout, which reads as a broken build rather than
          # a missing credential. `template` is the one exception, stated the
          # same way here and on the deploy step.
          # README § The content checkout is authenticated
          token: ${{ inputs.site != 'template' && secrets.DOCRENDER_TOKEN || github.token }}
          # A preference now, not a requirement (revlog.py no longer calls git).
          # The shallow-clone trap MOVED to the content repo's own workflow.
          # README § fetch-depth
          fetch-depth: 0

      - name: Check out the canonical design system
        id: canonical
        # continue-on-error IS the fallback: no directory means the vendored
        # theme/canonical/ renders and the report says so. Red X, green job.
        # ⚠️ A fallback here also SHRINKS the legal theme set, so an upstream
        # theme can be rejected as unknown.
        # README § The canonical design system is read live
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: mawizorek/maw-themes
          path: canonical
          token: ${{ secrets.DOCRENDER_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - name: Install the renderer
        working-directory: engine
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Render and report
        working-directory: engine
        env:
          DOCRENDER_INSTANCE: ${{ inputs.site }}
          DOCRENDER_CONTENT: ${{ github.workspace }}/content
          DOCRENDER_OUTPUT: ${{ github.workspace }}/site
          DOCRENDER_ENGINE_REF: ${{ steps.engine.outputs.sha }}
          DOCRENDER_DRY_RUN: ${{ inputs.mode == 'preview' && '1' || '0' }}
          # Both of these are ALWAYS set; the VALUE is what varies.
          # README § Why the env exports are inline
          DOCRENDER_CANONICAL: ${{ github.workspace }}/canonical
          DOCRENDER_THEME: ${{ inputs.theme }}
        run: |
          # ⚠️ Exported inline: $GITHUB_ENV only reaches LATER steps, so setting
          # these in another step leaves the build stamp reading `unstamped`.
          cd "${{ github.workspace }}/content"
          export DOCRENDER_COMMIT_SHA="$(git rev-parse HEAD)"
          export DOCRENDER_COMMIT_SUBJECT="$(git log -1 --pretty=%s)"
          cd "${{ github.workspace }}/engine"
          mkdocs build --config-file mkdocs.yml

      - name: Deploy
        if: inputs.mode == 'publish' && inputs.site != 'template'
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.DOCRENDER_TOKEN }}
          external_repository: ${{ steps.site.outputs.repo }}
          publish_branch: gh-pages
          publish_dir: ./site
          enable_jekyll: false
          # The note's DURABLE home (Actions logs age out; a commit does not),
          # and the only record of why a live site disagrees with its site.yml
          # after a themed publish. README § The `note` input
          commit_message: "publish: ${{ inputs.site }} from engine ${{ steps.engine.outputs.sha }}${{ inputs.theme != '' && format(' · theme: {0}', inputs.theme) || '' }}${{ inputs.note != '' && format(' · {0}', inputs.note) || '' }}"

      - name: What happens next
        if: always()
        env:
          CANONICAL: ${{ steps.canonical.outcome }}
        run: |
          {
            echo ""
            echo "---"
            echo "Built with engine \`${{ steps.engine.outputs.sha }}\` (main)."
            echo ""
            if [ "$CANONICAL" = "success" ]; then
              echo "Theme: **live** from \`mawizorek/maw-themes\`."
            else
              echo "⚠️ **Theme: fell back to the vendored copy.** The design"
              echo "system could not be checked out, so this build painted"
              echo "\`theme/canonical/\` -- a snapshot that may be days old. If"
              echo "you are here to check a colour change, THIS BUILD DOES NOT"
              echo "CONTAIN IT. If \`maw-themes\` is private, add it to"
              echo "\`DOCRENDER_TOKEN\`."
            fi
            echo ""
            if [ "${{ inputs.mode }}" = "preview" ]; then
              echo "**Nothing was deployed.** This was a preview. Run again with"
              echo "mode \`publish\` to push the diff above to the live site."
            elif [ "${{ inputs.site }}" = "template" ]; then
              echo "**Nothing was deployed from here.** The template publishes"
              echo "from \`publish-default.yml\` to this repo's own Pages."
            else
              echo "**Published.** Live in about a minute at the URL above."
              echo "The footer stamp on the site is how you confirm it landed:"
              echo "if it does not name this run, the deploy did not take."
            fi
            if [ -n "${{ inputs.theme }}" ] && [ "${{ inputs.mode }}" = "publish" ]; then
              echo ""
              echo "⚠️ **This publish wore a theme override.** The live site is"
              echo "not rendering what its \`site.yml\` declares. Nothing was"
              echo "written to disk, so publishing again with an empty **theme**"
              echo "box puts it back -- there is no file to revert."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
