name: Publish a site

# THE PUBLISH BUTTON. One site, on purpose, when its content is ready.
# Reasoning, traps and struck claims: ./publish-dl.md

run-name: >-
  ${{ inputs.site }} · ${{ inputs.mode }}${{ inputs.theme != '' && format(' · theme: {0}', inputs.theme) || '' }}${{ inputs.note != '' && format(' · {0}', inputs.note) || '' }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preview shows the diff and deploys nothing
        required: true
        default: publish
        type: choice
        options:
          - publish
          - preview
      site:
        # ⚠️ HAND-MAINTAINED and it cannot be otherwise: dispatch inputs are read
        # before any job starts. Adding a site is THREE edits — instance,
        # build.yml matrix, this list. `hml` shipped unpublishable on this one.
        # publish-dl.md § The site list is hand-maintained
        #
        # ⚠️ THESE MUST BE SLUGS, NOT NAMES. `mawprose` was `prose` until
        # 2026-08-08, when the slug failed the leak scan because "prose" is an
        # ordinary English word appearing in five engine files. A renamed slug
        # means editing this list AGAIN — the alias in site.yml covers the
        # terminal, not this dropdown.
        #
        # ⚠️ AND THE TWO URITP ENTRIES ARE DIFFERENT SITES (2026-08-16), which
        # is the one confusion this list can actively cause. `uritp` is the
        # working tree where safety material is drafted; `uritp-safety` is the
        # published human-facing filter of it. Publishing one never touches the
        # other, and picking the wrong one from this dropdown is a real mistake
        # somebody will make in a hurry — the run title names the slug, which is
        # the line to read before believing a deploy went where you meant.
        description: Which site
        required: true
        type: choice
        default: uritp
        options:
          - theatre
          - hml
          - template
          - uritp
          - uritp-safety
          - mawprose
      theme:
        # `string`, not `choice` — publish-dl.md § The `theme` input
        description: "(opt) For THIS build only."
        required: false
        default: ""
        type: string
      note:
        # publish-dl.md § The `note` input
        description: "Shows in the run title and the deploy commit."
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    name: ${{ inputs.site }} (${{ inputs.mode }})

    # =====================================================================
    # ONE DEPLOY AT A TIME PER SITE (2026-08-18)
    # =====================================================================
    # `gh-pages` is a branch, and a branch is a lock. The deploy action clones
    # that ref, empties it, copies the new site in, commits and pushes — so if
    # ANYTHING else lands on the ref between the clone and the push, the push is
    # rejected outright:
    #
    #   ! [remote rejected] gh-pages -> gh-pages (cannot lock ref
    #     'refs/heads/gh-pages': is at 1b5b9f1 but expected d5526e3)
    #
    # ⚠️ THAT IS NOT A BUILD FAILURE AND IT READS EXACTLY LIKE ONE. The render
    # was already finished and correct — 284 pages, live theme, full report —
    # and the job goes red on its last step having done every bit of the work.
    #
    # It happened for real on 2026-08-18: this workflow and `build.yml` (fired
    # by the five-minute poll) rendered `uritp` from the same engine SHA and the
    # same content SHA in the same SECOND. The poll pushed first, the human
    # publish lost the ref, and the site was already up to date by the time the
    # error appeared. A routine that deploys every five minutes makes that
    # window permanent rather than unlucky.
    #
    # 🔴 THE GROUP NAME IS THE ENTIRE MECHANISM AND IT MUST MATCH build.yml's.
    # Two workflows only share a queue if they name the same group; rename it on
    # one side and the race comes back silently, with the symptom appearing in
    # the OTHER file. Keyed to the SITE, so different sites still deploy in
    # parallel — they are different refs in different repos and have never been
    # able to conflict with each other.
    #
    # `cancel-in-progress: false` IS THE POINT, not a default worth skimming: a
    # queued run WAITS its turn. Cancelling would let a five-minute cron kill a
    # deliberate human publish mid-push, which is a worse failure than the one
    # this fixes.
    concurrency:
      group: gh-pages-${{ inputs.site }}
      cancel-in-progress: false

    # Matches build.yml. A hung render holds a runner 6h on the default ceiling.
    timeout-minutes: 10

    steps:
      - name: Check out the engine
        uses: actions/checkout@v4
        with:
          # ⚠️ EXPLICITLY main, not the triggering SHA. Otherwise a re-run
          # publishes an OLD engine over a newer build and looks healthy.
          # publish-dl.md § Re-run is not the same as run
          ref: main
          path: engine

      - name: Note which engine is actually building this
        id: engine
        working-directory: engine
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve the site
        id: site
        working-directory: engine
        # Content repo comes from the instance's site.yml, never restated here.
        run: |
          slug="${{ inputs.site }}"
          if [ ! -f "instances/$slug/site.yml" ]; then
            echo "::error::no instance '$slug'. Known instances:"
            ls -1 instances >&2
            exit 1
          fi
          repo=$(python3 -c "import yaml,sys; print(yaml.safe_load(open('instances/$slug/site.yml'))['content_repo'])")
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "Publishing \`$slug\` from \`$repo\`." >> "$GITHUB_STEP_SUMMARY"

      - name: State the reason, if one was given
        # Own step so it shows in the step LIST, not a collapsed log.
        env:
          NOTE: ${{ inputs.note }}
        run: |
          if [ -n "$NOTE" ]; then
            echo "Reason given: $NOTE"
            {
              echo ""
              echo "> **Why:** $NOTE"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No reason given. That is allowed; the field is optional."
          fi

      - name: State the theme override, if one was given
        # ⚠️ ECHOES ONLY. Cannot validate a name, cannot know a `random` roll.
        env:
          THEME: ${{ inputs.theme }}
        run: |
          if [ -n "$THEME" ]; then
            echo "Theme override requested: $THEME"
            {
              echo ""
              echo "> **Theme for this build only:** \`$THEME\` — requested at"
              echo "> dispatch. \`site.yml\` is not edited. The engine confirms"
              echo "> the theme it actually used in a notice at the top of this"
              echo "> run, which is the line to read if you asked for \`random\`"
              echo "> or if the name was rejected."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No theme override. This site renders the theme its site.yml declares."
          fi

      - name: Check out the content
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.site.outputs.repo }}
          ref: main
          path: content
          # ⚠️ AUTHENTICATED. A private content repo dies at exit 128 unauthenticated,
          # which reads as a broken build rather than a missing credential.
          # `template` is the one exception, stated the same way on the deploy step.
          # publish-dl.md § The content checkout is authenticated
          #
          # 🔴 AND A REPO TRANSFERRED IN AFTER THE PAT WAS MINTED IS NOT ON IT.
          # A fine-grained PAT is scoped to an explicit repository list and
          # nothing is added automatically. `uritp-safety` arrived by transfer on
          # 2026-08-16, so it needs adding to DOCRENDER_TOKEN by hand — and the
          # symptom of forgetting is this step failing with `exit code 128`,
          # which has already cost one debugging round on 2026-08-03 for exactly
          # this reason. It is a missing checkbox, not a broken build.
          #
          # ⚠️ AND THE OTHER SHAPE OF THE SAME PROBLEM, seen 2026-08-18: the
          # fallback below means an EMPTY OR WRONGLY-SCOPED SECRET does not fail
          # loudly, it quietly hands this step `github.token`, which is scoped to
          # THIS repo only. The message you get is `remote: Write access to
          # repository not granted` + 403 — which reads as a permissions problem
          # on the content repo when the real answer is that DOCRENDER_TOKEN
          # never reached the checkout. Check the SECRET before the repo.
          token: ${{ inputs.site != 'template' && secrets.DOCRENDER_TOKEN || github.token }}
          # A preference now, not a requirement. publish-dl.md § fetch-depth
          fetch-depth: 0

      - name: Check out the canonical design system
        id: canonical
        # continue-on-error IS the fallback: no directory means the vendored
        # theme/canonical/ renders and the report says so. Red X, green job.
        # ⚠️ A fallback here also SHRINKS the legal theme set.
        # publish-dl.md § The same staleness had a third source
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: mawizorek/maw-themes
          path: canonical
          token: ${{ secrets.DOCRENDER_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - name: Install the renderer
        working-directory: engine
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Render and report
        working-directory: engine
        env:
          DOCRENDER_INSTANCE: ${{ inputs.site }}
          DOCRENDER_CONTENT: ${{ github.workspace }}/content
          DOCRENDER_OUTPUT: ${{ github.workspace }}/site
          DOCRENDER_ENGINE_REF: ${{ steps.engine.outputs.sha }}
          DOCRENDER_DRY_RUN: ${{ inputs.mode == 'preview' && '1' || '0' }}
          # Both ALWAYS set; the VALUE is what varies.
          DOCRENDER_CANONICAL: ${{ github.workspace }}/canonical
          DOCRENDER_THEME: ${{ inputs.theme }}
        run: |
          # ⚠️ Exported inline: $GITHUB_ENV only reaches LATER steps, so setting
          # these elsewhere leaves the build stamp reading `unstamped`.
          cd "${{ github.workspace }}/content"
          export DOCRENDER_COMMIT_SHA="$(git rev-parse HEAD)"
          export DOCRENDER_COMMIT_SUBJECT="$(git log -1 --pretty=%s)"
          cd "${{ github.workspace }}/engine"
          mkdocs build --config-file mkdocs.yml

      - name: Deploy
        if: inputs.mode == 'publish' && inputs.site != 'template'
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.DOCRENDER_TOKEN }}
          external_repository: ${{ steps.site.outputs.repo }}
          publish_branch: gh-pages
          publish_dir: ./site
          enable_jekyll: false
          # The note's DURABLE home (Actions logs age out; a commit does not), and
          # the only record of why a live site disagrees with its own site.yml
          # after a themed publish. publish-dl.md § The `note` input
          commit_message: "publish: ${{ inputs.site }} from engine ${{ steps.engine.outputs.sha }}${{ inputs.theme != '' && format(' · theme: {0}', inputs.theme) || '' }}${{ inputs.note != '' && format(' · {0}', inputs.note) || '' }}"

      - name: What happens next
        if: always()
        env:
          CANONICAL: ${{ steps.canonical.outcome }}
        run: |
          {
            echo ""
            echo "---"
            echo "Built with engine \`${{ steps.engine.outputs.sha }}\` (main)."
            echo ""
            if [ "$CANONICAL" = "success" ]; then
              echo "Theme: **live** from \`mawizorek/maw-themes\`."
            else
              echo "⚠️ **Theme: fell back to the vendored copy.** The design"
              echo "system could not be checked out, so this build painted"
              echo "\`theme/canonical/\` -- a snapshot that may be days old. If"
              echo "you are here to check a colour change, THIS BUILD DOES NOT"
              echo "CONTAIN IT. If \`maw-themes\` is private, add it to"
              echo "\`DOCRENDER_TOKEN\`."
            fi
            echo ""
            if [ "${{ inputs.mode }}" = "preview" ]; then
              echo "**Nothing was deployed.** This was a preview. Run again with"
              echo "mode \`publish\` to push the diff above to the live site."
            elif [ "${{ inputs.site }}" = "template" ]; then
              echo "**Nothing was deployed from here.** The template publishes"
              echo "from \`publish-default.yml\` to this repo's own Pages."
            else
              echo "**Published.** Live in about a minute at the URL above."
              echo "The footer stamp on the site is how you confirm it landed:"
              echo "if it does not name this run, the deploy did not take."
            fi
            if [ -n "${{ inputs.theme }}" ] && [ "${{ inputs.mode }}" = "publish" ]; then
              echo ""
              echo "⚠️ **This publish wore a theme override.** The live site is"
              echo "not rendering what its \`site.yml\` declares. Nothing was"
              echo "written to disk, so publishing again with an empty **theme**"
              echo "box puts it back -- there is no file to revert."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
