# Base renderer config. Deliberately almost empty of identity.
#
# Everything that says WHICH SITE this is -- name, URL, palette, section titles
# -- is absent here and arrives from instances/<slug>/site.yml at build time,
# applied by hooks/00_instance.py. A hardcoded site name in this file is the
# design failing, and hooks/08 fails the build if one appears in CODE.
#
# The content tree is checked out separately and pointed at by
# DOCRENDER_CONTENT. It holds markdown, plus data files a page explicitly
# declares -- and nothing else. No nav file, no template, no stylesheet, no
# config. See docrender/datatable.py for why data is content and config is not.
#
# 🚫 NO `repo_url`. Setting it plants a repository widget in the header with
# the owner, name and star count. These are reference documents, not a project
# recruiting contributors. The foot-of-page edit link is composed independently
# in docrender/pagefoot.py and switched per site with `edit_links:`.

site_name: docrender
site_url: https://example.invalid/
docs_dir: !ENV [DOCRENDER_CONTENT, content]
site_dir: !ENV [DOCRENDER_OUTPUT, site]

use_directory_urls: true
strict: false

# A content repo is a repo first and a docs_dir second, so its own README and
# licence must not become pages. This is the one place those two roles collide.
exclude_docs: |
  README.md
  LICENSE
  LICENSE.md
  .github/

# Broken links render as visible markers and land in the build report rather
# than failing the deploy. v1 built with --strict and one typo froze the entire
# live site twice in forty minutes while Pages kept serving a stale commit.
validation:
  links:
    absolute_links: ignore
    unrecognized_links: ignore

theme:
  name: material
  features:
    # ⚠️ `navigation.sections` IS DELIBERATELY ABSENT (removed 2026-08-03).
    #
    # It renders top-level folders as flat, permanently-expanded headings --
    # every page on the site visible at once, nothing collapsible. That is
    # wrong for a tree that is going to keep growing, and it is why the sidebar
    # read as one long list instead of five sections you can open.
    #
    # Without it, each folder is a collapsible group, CLOSED by default. The
    # sidebar opens as a short list of top-level sections and expands where the
    # reader is. Do not re-add it, and do not add `navigation.expand` either --
    # that forces every group open, which is the same problem with extra steps.
    #
    # A folder's index.md BECOMES the folder's landing page instead of sitting
    # inside it as a duplicate entry.
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.prune
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    # Dark first: it is the default, and the toggle offers the other one.
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

# ⚠️ ORDER IN THIS LIST IS THE RUN ORDER, and two pairs depend on it:
#   00 sorts the nav  ->  00c rewires prev/next from the sorted tree
#   01 reads frontmatter -> 02 prunes -> 03 indexes what survived
# Renumbering without reading hooks/README.md will break something silently.
hooks:
  - hooks/00_instance.py
  - hooks/00c_nav.py
  - hooks/01_objects.py
  - hooks/01b_data.py
  - hooks/02_visibility.py
  - hooks/03_links.py
  - hooks/03b_markers.py
  - hooks/04b_router.py
  - hooks/05_assets.py
  - hooks/06_pagefoot.py
  - hooks/07_buildstamp.py
  - hooks/08_sizecheck.py
  - hooks/09_index.py
