# Base renderer config. Deliberately almost empty of identity.
#
# Everything that says WHICH SITE this is -- name, URL, palette, section titles
# -- is absent here and arrives from instances/<slug>/site.yml at build time,
# applied by hooks/00_instance.py. A hardcoded site name in this file is the
# design failing, and hooks/08 fails the build if one appears in CODE.
#
# The content tree is checked out separately and pointed at by
# DOCRENDER_CONTENT. It holds markdown, plus data files a page explicitly
# declares -- and nothing else. No nav file, no template, no stylesheet, no
# config. See docrender/datatable.py for why data is content and config is not.
#
# 🚫 NO `repo_url`. Setting it plants a repository widget in the header with
# the owner, name and star count. These are reference documents, not a project
# recruiting contributors. The foot-of-page edit link is composed independently
# in docrender/pagefoot.py and switched per site with `edit_links:`.

site_name: docrender
site_url: https://example.invalid/
docs_dir: !ENV [DOCRENDER_CONTENT, content]
site_dir: !ENV [DOCRENDER_OUTPUT, site]

use_directory_urls: true
strict: false

# A content repo is a repo first and a docs_dir second, so its own README and
# licence must not become pages. This is the one place those two roles collide.
exclude_docs: |
  README.md
  LICENSE
  LICENSE.md
  .github/

# Broken links render as visible markers and land in the build report rather
# than failing the deploy. v1 built with --strict and one typo froze the entire
# live site twice in forty minutes while Pages kept serving a stale commit.
validation:
  links:
    absolute_links: ignore
    unrecognized_links: ignore

theme:
  name: material
  features:
    # ⚠️ `navigation.sections` is DELIBERATELY ABSENT. It renders a top-level
    # folder as a permanently-open heading, which is the opposite of what is
    # wanted here: the sidebar should open as a short list of DEPARTMENTS a
    # reader can scan, and expand only where they are working.
    #
    # ⚠️ `navigation.expand` IS ALSO ABSENT, AND THAT ABSENCE IS NOW LOAD-
    # BEARING RATHER THAN INCIDENTAL. Without it, Material writes `checked`
    # onto a section's toggle for exactly one reason -- the section contains
    # the page you are on. docrender/navstate.py is built directly on top of
    # that: it ADDS `checked` for folders that declared `nav: expanded` and
    # never removes one, so "the active branch stays open" needs no code at
    # all. Enabling this feature checks everything, collapses that rule into
    # nothing, and silently turns the `nav:` key into a no-op.
    #
    # ⚠️ `navigation.prune` IS CONDITIONAL AT RUNTIME. navstate drops it from
    # this list during on_nav if any page in the content repo declares
    # `nav: expanded`, because a pruned nav renders no children for a section
    # the reader is not inside, so expanding one would open an empty box. The
    # build report says so on any build where it happens.
    - navigation.indexes
    - navigation.prune
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    # ⚠️ COLOUR IS NOT SET HERE ANY MORE (2026-08-04). These two entries carry
    # the light/dark TOGGLE and nothing else. `primary` and `accent` used to be
    # copied in per-instance by hooks/00_instance.py from site.yml; that loop is
    # gone, and the header, drawer and accent now resolve from the theme's
    # canonical tokens in assets/base.css.
    #
    # It was not only a tidy-up. Setting `palette.primary` is what makes
    # Material emit `data-md-color-primary` on the body, and its own
    # [data-md-color-scheme="slate"][data-md-color-primary="black"] rule -- two
    # attribute selectors against our one -- then outranked our link colour and
    # painted every dark-mode link blue. Do not reintroduce a primary here.
    #
    # Dark first: it is the default, and the toggle offers the other one.
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark

plugins:
  - search

# ⚠️ `attr_list` AND `md_in_html` ARE BOTH LOAD-BEARING AS OF 2026-08-06, and
# neither is here for authoring convenience any more. docrender/figure.py wraps
# a captioned image in `<figure markdown="1">` with a `<figcaption
# markdown="span">`, which is what lets the IMAGE stay ordinary markdown -- so
# MkDocs keeps rewriting its relative src and we never own that arithmetic.
# Removing `md_in_html` does not error: every captioned figure silently ships as
# literal `![alt](src)` text inside a raw HTML block.
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

# ⚠️ ORDER IN THIS LIST IS THE RUN ORDER, and five chains depend on it.
#
#   THE NAV CHAIN, five links, every one load-bearing. The consequence of each
#   misordering is written down because a bare sequence tells nobody what breaks:
#
#     00    sort   instance.py orders the tree
#     00b   prune  unlisted pages leave the sidebar
#     00bb  shape  `nav: hidden` folders lose their children
#     00bc  seal   routed folders seal whatever is LEFT
#     00c   chain  prev/next rebuilt from what survived all four
#
#   00b or 00bb after 00c  -> the footer Next button walks through pages that
#                             are not in the sidebar.
#   00bc before 00bb       -> a `nav: hidden` folder inside a routed folder is
#                             sealed with its children still in it, and a
#                             correct router code puts them back in the sidebar.
#                             Does not fail, does not warn, and looks correct to
#                             everybody without the code. Live bug, 2026-08-05,
#                             which is why `visibility.seal_nav` ALSO checks
#                             `state.NAV_SHAPED` at runtime and reports if this
#                             list drifts. See docrender/visibility.py.
#
#   01 reads frontmatter -> 02 prunes files -> 03 indexes what survived
#   01d emits marker syntax -> 03b renders it. Move 01d after 03b and the token
#      audit page ships its specimens as literal text.
#   01e wraps a captioned image and leaves the caption as MARKDOWN -> 03 and 03b
#      resolve its @refs and markers on their ordinary pass. Move 01e after
#      either one and the figure renders perfectly while its caption keeps
#      literal `@id` and `{.tbc}` syntax -- the 01d failure exactly, one stage
#      over, and harder to spot because only the caption is wrong.
#   01f indexes every image by filename for `@img:`. ⭐ ITS POSITION IS FREE and
#      that is worth stating so nobody defends it: the prefix claim happens at
#      hook IMPORT, and MkDocs runs every hook's on_files before any hook's
#      on_page_markdown, so links.py at 03 cannot see a half-built index no
#      matter where this line sits. It is here because 01e and 01f read as one
#      feature -- 01e wraps a captioned image, 01f knows where the image is.
#   00bb decides which folders open -> 06b writes that onto the rendered page.
#      Two different EVENTS (on_nav, on_post_page), so this pair cannot be
#      reordered into a bug -- it is listed because the dependency is real even
#      where the ordering is free.
#   09 runs last, because it describes the finished site
# Renumbering without reading hooks/README.md will break something silently.
#
# ⚠️ THIS LIST IS THE REGISTRATION, NOT THE hooks/ FOLDER. A file sitting in
# hooks/ that is absent from here is never loaded and does nothing whatsoever.
# `hooks/04_theme.py` is exactly that today and has been for some time. It is
# harmless only by accident: docrender/assets.py calls `theme.build_css()`
# itself, so the tokens are generated regardless and the dead shim was never
# missed. Adding a stage is TWO edits, the file and this line.
#
# ⚠️ AND REMOVING ONE IS TWO EDITS IN THE OTHER ORDER: unregister here FIRST,
# then delete the file. A listed file that no longer exists raises ImportError
# before the build starts and takes every later hook down with it, so the
# reverse order turns a tidy-up into a dead site. `01c_revlog` came out that
# way on 2026-08-04 (the revision log is a `!!! data` table now, so the stage
# had no caller left on any instance).
hooks:
  - hooks/00_instance.py
  - hooks/00b_unlisted.py
  - hooks/00bb_navstate.py
  - hooks/00bc_seal.py
  - hooks/00c_nav.py
  - hooks/01_objects.py
  - hooks/01b_data.py
  - hooks/01d_audit.py
  - hooks/01e_figure.py
  - hooks/01f_images.py
  - hooks/02_visibility.py
  - hooks/03_links.py
  - hooks/03b_markers.py
  - hooks/04b_router.py
  - hooks/05_assets.py
  - hooks/06_pagefoot.py
  - hooks/06b_navstate.py
  - hooks/07_buildstamp.py
  - hooks/08_sizecheck.py
  - hooks/09_index.py
