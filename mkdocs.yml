# Base renderer config. Deliberately almost empty of identity.
#
# Everything that says WHICH SITE this is -- name, URL, palette, section titles
# -- is absent here and arrives from instances/<slug>/site.yml at build time,
# applied by hooks/00_instance.py. A hardcoded site name in this file is the
# design failing, and hooks/08 fails the build if one appears in CODE.
#
# The content tree is checked out separately and pointed at by
# DOCRENDER_CONTENT. It holds markdown, plus data files a page explicitly
# declares -- and nothing else. No nav file, no template, no stylesheet, no
# config. See docrender/datatable.py for why data is content and config is not.
#
# 🚫 NO `repo_url`. Setting it plants a repository widget in the header with
# the owner, name and star count. These are reference documents, not a project
# recruiting contributors. The foot-of-page edit link is composed independently
# in docrender/pagefoot.py and switched per site with `edit_links:`.
#
# 🚫 AND NO `theme.font` (2026-08-19). It looks like the obvious home for the
# typeface and it is the wrong one twice over: a family name here is IDENTITY in
# a file that holds none, and it would be a SECOND CLAIMANT on a fact
# theme/canonical/typography.tsv already owns across six rows. docrender/fonts.py
# (stage 04c) reads the resolved row instead and sets `theme.font = False` at
# on_config, which is Material's documented switch for "I load fonts myself" --
# so the Roboto request Material makes BY DEFAULT, and which assets/base.css has
# always overridden away unused, is gone.

site_name: docrender
site_url: https://example.invalid/
docs_dir: !ENV [DOCRENDER_CONTENT, content]
site_dir: !ENV [DOCRENDER_OUTPUT, site]

use_directory_urls: true
strict: false

# A content repo is a repo first and a docs_dir second, so its own README and
# licence must not become pages. This is the one place those two roles collide.
exclude_docs: |
  README.md
  LICENSE
  LICENSE.md
  .github/

# Broken links render as visible markers and land in the build report rather
# than failing the deploy. v1 built with --strict and one typo froze the entire
# live site twice in forty minutes while Pages kept serving a stale commit.
validation:
  links:
    absolute_links: ignore
    unrecognized_links: ignore

theme:
  name: material
  features:
    # ⚠️ `navigation.sections` is DELIBERATELY ABSENT. It renders a top-level
    # folder as a permanently-open heading, which is the opposite of what is
    # wanted here: the sidebar should open as a short list of DEPARTMENTS a
    # reader can scan, and expand only where they are working.
    #
    # ⚠️ `navigation.expand` IS ALSO ABSENT, AND THAT ABSENCE IS NOW LOAD-
    # BEARING RATHER THAN INCIDENTAL. Without it, Material writes `checked`
    # onto a section's toggle for exactly one reason -- the section contains
    # the page you are on. docrender/navstate.py is built directly on top of
    # that: it ADDS `checked` for folders that declared `nav: expanded` and
    # never removes one, so "the active branch stays open" needs no code at
    # all. Enabling this feature checks everything, collapses that rule into
    # nothing, and silently turns the `nav:` key into a no-op.
    #
    # ⚠️ `navigation.prune` IS CONDITIONAL AT RUNTIME, and since 2026-08-16 the
    # condition is stricter than it reads. It is dropped from this list during
    # on_nav only if a folder declares `nav: expanded` AND IS STILL IN THE
    # SIDEBAR once the router seal has run -- because a pruned nav renders no
    # children for a section the reader is not inside, so expanding one would
    # open an empty box. 🔴 The old rule dropped it the moment ANYTHING resolved
    # to `expanded`, including folders the seal removed two stages later, so
    # uritp shipped its whole nav tree on every page for eleven days on account
    # of one invisible folder. docrender/navsettle.py (stage 00bd) owns the
    # decision now. The build report says which way it went on every build.
    - navigation.indexes
    - navigation.prune
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    # ⚠️ COLOUR IS NOT SET HERE ANY MORE (2026-08-04). These two entries carry
    # the light/dark TOGGLE and nothing else. `primary` and `accent` used to be
    # copied in per-instance by hooks/00_instance.py from site.yml; that loop is
    # gone, and the header, drawer and accent now resolve from the theme's
    # canonical tokens in assets/base.css.
    #
    # It was not only a tidy-up. Setting `palette.primary` is what makes
    # Material emit `data-md-color-primary` on the body, and its own
    # [data-md-color-scheme="slate"][data-md-color-primary="black"] rule -- two
    # attribute selectors against our one -- then outranked our link colour and
    # painted every dark-mode link blue. Do not reintroduce a primary here.
    #
    # Dark first: it is the default, and the toggle offers the other one.
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark

plugins:
  - search

# ⚠️ `attr_list` AND `md_in_html` ARE BOTH LOAD-BEARING AS OF 2026-08-06, and
# neither is here for authoring convenience any more. docrender/figure.py wraps
# a captioned image in `<figure markdown="1">` with a `<figcaption
# markdown="span">`, which is what lets the IMAGE stay ordinary markdown -- so
# MkDocs keeps rewriting its relative src and we never own that arithmetic.
# Removing `md_in_html` does not error: every captioned figure silently ships as
# literal `![alt](src)` text inside a raw HTML block.
#
# ⚠️ AND `attr_list` IS WHAT MAKES EVERY MARKER RENDER. docrender/markers.py and
# markerlinks.py both emit `{ .class }` blocks for Python-Markdown to consume.
# Remove it and every chip and every marker link ships as literal `{ .dr-mark }`
# text on the page -- and `toc: permalink` is what gives a heading an id for
# `@calc:table-x#calc-y` to land on, with `attr_list` supplying the `{#explicit}`
# form that survives a heading being retitled.
#
# ⚠️ `attr_list` IS ALSO WHAT MAKES `{.new-page}` WORK (2026-08-19), which is
# worth naming because that token has no Python behind it at all: it is one
# `break-before: page` rule in assets/print-flow.css, reached entirely through
# this extension. Remove the line and the class silently stops arriving.
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

# ⚠️ ORDER IN THIS LIST IS THE RUN ORDER, and six chains depend on it.
#
#   THE NAV CHAIN, six links, every one load-bearing. The consequence of each
#   misordering is written down because a bare sequence tells nobody what breaks:
#
#     00    sort    instance.py orders the tree
#     00b   prune   unlisted pages leave the sidebar
#     00bb  shape   `nav: hidden` folders lose their children
#     00bc  seal    routed folders seal whatever is LEFT
#     00bd  settle  navigation.prune is spent on what SURVIVED all of the above
#     00c   chain   prev/next rebuilt from what survived all five
#
#   00b or 00bb after 00c  -> the footer Next button walks through pages that
#                             are not in the sidebar.
#   00bc before 00bb       -> a `nav: hidden` folder inside a routed folder is
#                             sealed with its children still in it, and a
#                             correct router code puts them back in the sidebar.
#                             Does not fail, does not warn, and looks correct to
#                             everybody without the code. Live bug, 2026-08-05,
#                             which is why `visibility.seal_nav` ALSO checks
#                             `state.NAV_SHAPED` at runtime and reports if this
#                             list drifts. See docrender/visibility.py.
#   00bd before 00bc       -> it reads a provisional tree. A folder sealed behind
#                             a router still counts as `expanded`, so the site
#                             drops `navigation.prune` and ships its whole nav
#                             tree on EVERY page (~33% of page weight) for a row
#                             no reader can click. Also silent, also invisible
#                             without a code. Live on uritp for eleven days until
#                             2026-08-16, when this stage was split OUT of 00bb
#                             -- which is where that decision used to be made.
#                             See docrender/navsettle.py.
#
#   ⭐ THOSE LAST TWO ARE ONE LAW FROM OPPOSITE ENDS: a stage that READS a
#   declaration and a stage that SPENDS a resource on it are not the same stage.
#
#   ⭐ AND 00c IS NO LONGER PURELY DOWNSTREAM OF THAT TREE (2026-08-19). A
#   `chain:` on a page that owns an ordering -- a folder `index.md`, or a
#   `type: program` -- re-points prev/next among the pages it NAMES, reading
#   `state.BY_SRC` rather than the nav. That is the whole point: BY_SRC is
#   populated before anything prunes, so a reading order can include pages that
#   are `unlisted`, behind a `nav: hidden` folder, or sealed -- out of the
#   sidebar and out of search, still in the flow. It stays at 00c because the
#   default wiring runs FIRST and the chain is an override on top of it.
#
#   01 reads frontmatter -> 02 prunes files -> 03 indexes what survived
#   01d emits marker syntax -> 03b renders it. Move 01d after 03b and the token
#      audit page ships its specimens as literal text.
#   01e wraps a captioned image and leaves the caption as MARKDOWN -> 03 and 03b
#      resolve its @refs and markers on their ordinary pass. Move 01e after
#      either one and the figure renders perfectly while its caption keeps
#      literal `@id` and `{.tbc}` syntax -- the 01d failure exactly, one stage
#      over, and harder to spot because only the caption is wrong.
#   01f indexes every image by filename for `@img:`. ⭐ ITS POSITION IS FREE and
#      that is worth stating so nobody defends it: the prefix claim happens at
#      hook IMPORT, and MkDocs runs every hook's on_files before any hook's
#      on_page_markdown, so links.py at 03 cannot see a half-built index no
#      matter where this line sits. It is here because 01e and 01f read as one
#      feature -- 01e wraps a captioned image, 01f knows where the image is.
#   03 resolves links -> 03b renders marker SPANS. Marker syntax and link syntax
#      are different patterns, but running the id resolver first keeps its output
#      out of the marker pattern's way: a resolved marker link emits a two-class
#      attr_list block, and 03b's pattern only matches a single-class one.
#   03c claims the marker LINK namespaces (@rel:, @calc:, @vl: and the rest,
#      derived from the `prefix` column of theme/markers.tsv). ⭐ ITS POSITION IS
#      ALSO FREE, for exactly the reason 01f's is -- the claim happens at import,
#      and its resolvers are called BY links.py at 03, not by a later stage. It
#      sits here because 03b and 03c are two halves of one feature.
#      🚨 BUT ITS PRESENCE IS NOT OPTIONAL. Remove this line and markerlinks is
#      never imported, so nothing claims anything and every marker link on every
#      site renders as a broken reference. See hooks/03c_markerlinks.py.
#   03d claims `@url:` -- an EXTERNAL link named once in `site.yml` (or in a
#      page's own frontmatter) and referenced by name. ⭐ ITS POSITION IS FREE for
#      the same reason 03c's and 01f's are, and 🚨 ITS PRESENCE IS NOT OPTIONAL for
#      the same reason as well: the claim happens at import, so removing this
#      line leaves every `@url:` on every site rendering as "unknown peer site:
#      url" -- links.py behaving correctly, and a total mystery from the author's
#      chair. See hooks/03d_urllinks.py and docrender/urllinks.py.
#   04c FETCHES the font families theme/canonical/typography.tsv already names
#      (2026-08-19). ⭐ ITS POSITION IS FREE IN THE ONE WAY THAT USUALLY MATTERS
#      HERE AND PINNED IN A DIFFERENT ONE. It shares no selector with any sheet
#      this engine ships, so it can neither win nor lose a specificity tie --
#      contrast `_DATA_ASSETS` in docrender/assets.py, where the order IS the
#      rule. What it does need is to run AFTER 00, because it reads the resolved
#      instance to find out which typography row applies. It sits before 05 so
#      the font stylesheet lands ahead of the ordered asset group rather than
#      inside it.
#      🚨 AND ITS PRESENCE IS NOT OPTIONAL, same shape as 03c and 03d but with a
#      quieter symptom: remove this line and `theme.font` is never set to False,
#      so Material resumes fetching ROBOTO on every page -- a webfont downloaded
#      and then overridden away by assets/base.css -- while every stack in the
#      typography vector falls through to its declared `system-ui` fallback. The
#      site looks exactly as it did before 2026-08-19 and nothing reports it.
#      ⚠️ The build report names every family requested on every build, which is
#      the first line to read if the faces do not change.
#   05b renders the FLOW STRIP and the embedded completion FORM (2026-08-19).
#      🔴 ITS POSITION IS NOT FREE, AND IT IS THE on_page_content HALF THAT PINS
#      IT: it must precede 06, because pagefoot.py appends the edit link there
#      and a reader's next step outranks a maintainer's -- a flow strip below
#      "Edit this page on GitHub" reads as an afterthought. One registration
#      sets the position of every event a stage handles, so its
#      `on_page_markdown` half inherits this slot and is therefore LATE. That is
#      safe rather than lucky: the form block it emits contains no `@`
#      references and no marker syntax, so nothing between 03 and here had
#      anything to resolve inside it. 🚨 AND ITS PRESENCE IS NOT OPTIONAL, same
#      shape as 03c and 03d: remove this line and every `!!! form` renders as an
#      ordinary grey admonition titled "form" where a compliance form should be,
#      while every flow strip silently stops rendering and `chain:` keeps
#      working perfectly. See hooks/05b_program.py.
#   00bb decides which folders WANT to open -> 00bd decides which of them still
#      CAN -> 06b writes it onto the rendered page. The first two are the same
#      event (on_nav) and their order is a real constraint; 06b is on_post_page
#      and cannot be reordered into a bug. Listed because the dependency is real
#      even where part of the ordering is free.
#   07 emits the build stamp TWICE per page -- a print-only corner mark first in
#      the content flow and a screen-only line last (2026-08-19). 🔴 ITS
#      REGISTRATION IS THE CAUTIONARY TALE FOR THIS WHOLE LIST: hooks/07 imported
#      only `on_config` for the first 27 minutes of that change, so the line that
#      REMOVED the old footer stamp ran and the line that added the replacement
#      was never called. The stamp vanished from every page of every site,
#      including screen, where it had worked for months. A shim that imports one
#      event out of two is indistinguishable from a correct one until you look at
#      the output. See hooks/07_buildstamp.py.
#
#   08 finishes the report -> 08b renders it into the page that asked for one.
#      🔴 THE ONLY ORDERING HERE THAT IS ABOUT AN ACCUMULATOR RATHER THAN A
#      TREE, which is why it does not read like its neighbours. Everything above
#      describes pages, nav entries or markdown moving through stages; this is
#      about `state.REPORT` still FILLING. Hook 08's size budget and leak scan
#      are its last two writers, so 08b substituting first ships a page missing
#      exactly the findings 08 exists to produce -- silently, and looking
#      completely correct, which is the whole reason the report was moved out of
#      a print loop in the first place.
#      ⚠️ 08b's `on_page_markdown` is therefore late TOO, and not by choice: one
#      registration sets the position of every event a stage handles, and the
#      post-build end is the end that matters. Nothing between 01 and 08 reads
#      `!!!` directives it does not own, so the literal line costs nothing while
#      it waits.
#      ⚠️ THAT LAST SENTENCE NARROWED ON 2026-08-19: 05b DOES read a `!!!`
#      directive, and it owns `!!! form` exclusively. Two stages now consume
#      block directives and neither can see the other's, which is fine and is
#      the reason the claim is written as "directives it does not own" rather
#      than "no directives at all."
#
#   09 runs last, because it describes the finished site
# Renumbering without reading hooks/README.md will break something silently.
#
# ⚠️ THIS LIST IS THE REGISTRATION, NOT THE hooks/ FOLDER. A file sitting in
# hooks/ that is absent from here is never loaded and does nothing whatsoever.
# `hooks/04_theme.py` is exactly that today and has been for some time. It is
# harmless only by accident: docrender/assets.py calls `theme.build_css()`
# itself, so the tokens are generated regardless and the dead shim was never
# missed. Adding a stage is TWO edits, the file and this line.
#
# ⚠️ AND REMOVING ONE IS TWO EDITS IN THE OTHER ORDER: unregister here FIRST,
# then delete the file. A listed file that no longer exists raises ImportError
# before the build starts and takes every later hook down with it, so the
# reverse order turns a tidy-up into a dead site. `01c_revlog` came out that
# way on 2026-08-04 (the revision log is a `!!! data` table now, so the stage
# had no caller left on any instance).
hooks:
  - hooks/00_instance.py
  - hooks/00b_unlisted.py
  - hooks/00bb_navstate.py
  - hooks/00bc_seal.py
  - hooks/00bd_navsettle.py
  - hooks/00c_nav.py
  - hooks/01_objects.py
  - hooks/01b_data.py
  - hooks/01d_audit.py
  - hooks/01e_figure.py
  - hooks/01f_images.py
  - hooks/02_visibility.py
  - hooks/03_links.py
  - hooks/03b_markers.py
  - hooks/03c_markerlinks.py
  - hooks/03d_urllinks.py
  - hooks/04b_router.py
  - hooks/04c_fonts.py
  - hooks/05_assets.py
  - hooks/05b_program.py
  - hooks/06_pagefoot.py
  - hooks/06b_navstate.py
  - hooks/07_buildstamp.py
  - hooks/08_sizecheck.py
  - hooks/08b_report.py
  - hooks/09_index.py
