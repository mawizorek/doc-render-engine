# The parent every other declaration extends.
#
# These four fields are the contract. Everything else in the family is
# optional somewhere, and these are optional nowhere.
#
#   id      IDENTITY, and a promise. Other pages link to this string, so moving
#           the file, renaming its folder, or retitling the page cannot break
#           an inbound link. Set once, never change. That is the whole point.
#   title   what a human sees.
#   status  the publication gate. Mandatory with no default, so a page that
#           forgets it does not build. Nothing goes public by accident.
#   summary THE LEDE. One or two lines: what this is and who needs it.
#
# ⭐ WHY summary IS REQUIRED (added 2026-08-03). It used to be "whatever
# paragraph happens to sit under the H1", which meant it was defined three
# times in three languages -- the stylesheet, this engine, and Material's
# search plugin -- and nothing reconciled them. It is a field now, for the same
# reason `status` is a field: the page cannot tell you it is missing. A page
# with no lede looks completely normal until you meet it in a search result,
# where it has no text under its title at all.
#
# ⚠️ Making it required reports EVERY page written before this change, because
# they all carry their lede positionally. That is the migration worklist, not a
# regression. Nothing fails; the build warns and publishes. See
# docrender/lede.py for why there is deliberately no positional fallback.

type: _base
label: Page
requires:
  - id
  - title
  - status
  - summary
optional:
  - revised      # when this was last true. Provenance, not decoration.
  - order        # sort weight in the sidebar. Absent sorts alphabetically.
  - theme        # skin override. A page beats its folder on LOOK.
  - related      # ids, not paths
  - xref         # peer:id references to sibling sites
  - source       # where the facts came from
  - keywords     # other words for this thing: [genie, personnel lift, MEWP]
                 #
                 # ⚠️ RENAMED FROM `also_known_as` 2026-08-04, Michael. The old
                 # key is listed in objects.py _LEGACY_KEYS and is REPORTED at
                 # build until nobody uses it -- a rename is the one change a
                 # reader of the page cannot see, because the old key parses as
                 # valid YAML, gets ignored, and the line silently stops working.
                 #
                 # ⭐ THE NAME CHANGE WIDENS WHAT BELONGS HERE, and that is the
                 # point rather than a side effect. `also_known_as` could only
                 # honestly hold ALIASES -- other names for the same thing.
                 # `keywords` also holds the words somebody would SEARCH for
                 # that are not names at all: a lighting page wanting `LX` and
                 # `electrics`. The rendered label moved with it for exactly
                 # this reason; "Also called: electrics" was about to be false.
                 #
                 # Renders as a quiet visible line at the foot, and is indexed
                 # for exactly that reason -- the words are ON THE PAGE. A
                 # HIDDEN meta block was the rejected alternative: nobody can
                 # see it, so nobody can audit it, so it rots silently and the
                 # first symptom is a search that stopped matching. Visible is
                 # the whole mechanism; the field name was never the point.
  - indexed      # `false` keeps this page out of the contents list drawn by
                 # the INDEX PAGE above it. Default true.
                 #
                 # ⚠️ THREE THINGS IN THIS ENGINE ARE CALLED AN INDEX AND THIS
                 # IS ONLY ONE OF THEM. `indexed: false` does NOT remove the
                 # page from /doc-index.json -- it is still published there,
                 # because that file is the cross-site link contract and
                 # dropping a page from it would break `@peer:id` links from
                 # other sites. It does not touch the SEARCH index either;
                 # that is `status: unlisted`. It means one thing: the list of
                 # links at the foot of the parent index page.
  - data         # the page's data tables, as a MAP of named slots. Added to
                 # this list 2026-08-04, and the fact that it was ABSENT until
                 # then is the point: datatable.py has honoured `data:` since
                 # it shipped, so the engine was reading a field no type had
                 # ever declared. Exactly the defect the type system exists to
                 # prevent, sitting inside the type system.
                 #
                 # WHICH slots are legal is `data_slots` below, per type.

# ══════════════════════════════════════════════════════════════════════════════
# DATA SLOTS -- the vocabulary of table names a page may carry.
# ══════════════════════════════════════════════════════════════════════════════
#
#     data:
#       inventory_table:
#         file: audio-inventory.tsv
#         caption: Audio inventory      # optional
#
# and in the body, `!!! data "inventory_table"` draws it.
#
# ⭐ WHY THE TYPE OWNS THE NAME AND NOT THE AUTHOR. The goal is one body of
# prose that copies between LX, Audio and Video with only the frontmatter
# changed. That only holds if the KEY is the same word on all three pages. Under
# free naming, Audio writing `inventory_table` and Video writing `inventory`
# breaks the shared paragraph on the paste -- and breaks it as a dead reference
# on a page that otherwise looks completely fine.
#
# So a slot is a FIELD, visible to the type spec and reportable at build, for
# the same reason the lede became one.
#
# ⚠️ EMPTY HERE ON PURPOSE. A slot legal on every page in the family is legal in
# places it makes no sense (a procedure does not have an inventory). Declare
# slots on the TYPE that needs them. A one-line global list was offered and
# rejected; so was "declared slots plus page-local extras", which would have
# reopened the free-naming hole through a side door.
#
# ⚠️ SLOTS ARE NOT INHERITED SIDEWAYS. Adding `revision_log` to `reference` does
# NOT make it legal on `procedure`. That is the intended cost.
data_slots: []
