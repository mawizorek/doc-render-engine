# A PROGRAM: the thing somebody COMPLETES, in an order, and proves.
#
# The second type in this family that describes a page's ROLE IN THE TREE
# rather than the kind of fact it holds -- `index` was the first. The
# difference between them is the whole reason this exists:
#
#   index    a hub for the pages BENEATH it. Its ordering is its folder.
#   program  a curriculum ACROSS the tree. Its ordering is a path, and the
#            pages on that path live wherever they live and belong to nobody.
#
# ⭐ IT WAS NOT INVENTED. uritp-safety already had `30-programs/`, and
# `general-safety-for-all.md` already said "Review the following policies:" and
# then listed them, while every policy page carried the inverse "Part of
# [General Safety for All]" line typed by hand. Both directions of one graph,
# maintained manually, in a repo whose engine already publishes a reference
# graph for free. This type is that content pattern given a name.
#
# 🚫 AND A TRAINING IS NOT A FOURTH TYPE. `30-programs/index.md` ruled on that
# before this file existed: "a training is a program wearing a different word.
# It is not a separate kind of object and does not get separate machinery."
# Quoted rather than paraphrased, because it also pre-refused a `type: flow`
# that was drafted and dropped on 2026-08-19 for exactly this reason.
#
# ⚠️ THE PAGES IN A PROGRAM ARE BORROWED, NEVER OWNED. A policy is reference
# material that several programs walk through; it does not belong to any of
# them, it is not moved, and it is not edited. This is the one type whose
# ordering names pages in other folders as a matter of course.
#
# ══════════════════════════════════════════════════════════════════════════════
# 🔴 THE FOOTER CONTRACT, RULED BY MICHAEL 2026-08-19 AND NOT EXPRESSIBLE HERE
# ══════════════════════════════════════════════════════════════════════════════
#
# A program page and every page in its chain should carry `hide: footer`, so the
# FLOW STRIP is the only navigation. The first version shipped the strip BESIDE
# Material's prev/next and Michael rejected it in exactly the right words: "all
# this other foot matter," and "is that what I'm supposed to click next? It's not
# actually appearing in the main footer; it's in this other separate footer you
# created." Two footers, and the wrong one looked authoritative.
#
# ⭐ HIDING THE DEFAULT FOOTER ALSO DISSOLVES THE ONE-SLOT PROBLEM. A page has one
# `previous_page` and one `next_page`, so two programs sharing a policy cannot
# both own its buttons -- but strips do not compete, so if strips are the only
# navigation then both programs navigate correctly.
#
# ⚠️ AND IT IS A TRAP, WHICH IS WHY IT IS WRITTEN DOWN RATHER THAN ASSUMED: a
# page with `hide: footer` and NO flow has ZERO navigation, and nothing reports
# it. Dropping a page out of a chain removes its strip and strands it. The type
# system cannot see this -- `hide:` is Material's key, not ours, and nothing in
# this family validates `optional` at all.

type: program
label: Program
extends: _base
optional:
  - chain         # THE READING ORDER, as a list of `id:` values. Identical key,
                  # identical semantics and the SAME implementation as on
                  # `index` -- see objects/index.yml for the full argument and
                  # docrender/nav.py for the code.
                  #
                  # ⭐ WHY THE KEY IS SHARED RATHER THAN A SECOND SPELLING. A
                  # program-specific `steps:` would be a second name for one
                  # idea, resolved by one function, and this repo has retired
                  # three manifests for exactly that shape. The legality rule
                  # is therefore stated as a CAPABILITY, not a filename: a
                  # `chain:` is legal on a page that OWNS AN ORDERING, which is
                  # `index` (a folder's order) or `program` (a curriculum's).
                  #
                  # ⚠️ AND THIS IS THE TYPE WHERE IT CROSSES FOLDERS. That
                  # always worked -- ids resolve against every built page with
                  # no folder filter -- but the STRAGGLER REPORT was written
                  # folder-scoped on 2026-08-19 and had to be re-scoped hours
                  # later, because on a program it reported the wrong siblings
                  # entirely: the other programs, and never the policies.
                  #
                  # 🔴 ONE PAGE, ONE SET OF BUTTONS. If two chains name the same
                  # page, the FIRST declaration (alphabetical by source path)
                  # keeps prev/next and the other gets a strip only. This bit for
                  # real: `20-policies/index.md` declared a chain over the same
                  # nine policies, sorted ahead of `30-programs/`, and every
                  # program resolved to ZERO steps -- so a program's Next pointed
                  # at the next PROGRAM and the first policy's Previous pointed
                  # back at the policy shelf. A reference folder should not
                  # declare a chain over pages its programs walk.
                  #
                  # 🚫 It is NOT a completion record and cannot become one. The
                  # chain says what to read; the FORM says somebody did. A
                  # static site can prove neither, which is what `forms:` is
                  # for and why the record lives in ClickUp.
                  #
                  # 🔴 AND SINCE BUILD 10 IT HAS A SECOND CONSUMER: `export:`
                  # below turns this same list into a printable packet. A chain
                  # that silently loses a member now costs a DOCUMENT rather
                  # than a button, which is why packetbuild reports its member
                  # count against the declared count on every build.
  - forms         # EMBEDDED CLICKUP FORMS, as a map of named slots. The
                  # completion artifact, in the page, so a reader never leaves
                  # the document they were told to read.
                  #
                  #     forms:
                  #       completion:
                  #         src: https://forms.clickup.com/<...>?Program_ID=X
                  #         text: General Safety completion form
                  #         collapsed: true
                  #
                  # and in the body, `!!! form "completion"` draws it.
                  #
                  # ⭐ IT IS A REGISTRY, NOT AN IFRAME IN THE BODY, AND THAT WAS
                  # MICHAEL'S ASK VERBATIM (2026-08-19): "love that i can define
                  # in frontmatter, well outside of the actual body content."
                  # The content repo holds markdown and declared data and
                  # nothing else; an iframe tag and a CDN script tag are
                  # machinery, so the page NAMES a form and the engine builds
                  # the element. Same split as `data:` slots and the `links:`
                  # registry.
                  #
                  # ⭐ `collapsed: true` RENDERS IT SHUT, AND IT SOLVES A
                  # SEQUENCING PROBLEM RATHER THAN A STYLING ONE. A program page
                  # is BOTH the entrance and the exit: a reader lands there
                  # before reading anything and returns there to submit. An open
                  # form on arrival instructs somebody to certify material they
                  # have not read -- the pre-filled-checklist hazard
                  # `30-programs/index.md` already warns about. Michael:
                  # "if the form could not be so stand out on the first landing
                  # but then when we circle back to ending there on the same
                  # page - it's easily found."
                  #
                  # The LAST STEP of the chain links to the form's own fragment,
                  # and a fragment pointing inside a closed `<details>` expands
                  # it -- so arriving from the end of the program opens the form
                  # with no script and no state. Where that browser behaviour is
                  # missing it degrades to one visible click, never a dead end.
                  #
                  # ⚠️ LEGAL ON ANY PAGE, unlike `chain:`. A form is not a fact
                  # about an ordering -- a single policy page can carry an
                  # acknowledgement without being a program. Declared here
                  # because this is the type that always has one.
                  #
                  # 🔴 THE PREFILL PARAM IS THE RECORD. `?Program_ID=` on the src
                  # is what makes a submission land against the right program.
                  # It was already in uritp-safety's `links:` block before this
                  # key existed; it moves onto the src unchanged. A form
                  # embedded WITHOUT it collects submissions nobody can
                  # attribute, which is a compliance failure that looks like a
                  # working page.
                  #
                  # ⚠️ UNVERIFIABLE AT BUILD TIME, exactly like `@url:`. The
                  # engine checks the scheme and the host and can prove nothing
                  # about whether the form is active, public, or still exists.
  - export        # WHAT THIS PROGRAM CAN BE HANDED OUT AS. BUILD 10, 2026-08-30.
                  # See docrender/packet.py and specs/print-packet.md.
                  #
                  #     export: [packet]
                  #
                  # One kind exists: `packet` -- the whole chain concatenated
                  # into ONE generated page, cover first, one policy per sheet,
                  # printed with an ordinary Ctrl+P.
                  #
                  # ⭐ DECLARED, NEVER AUTOMATIC, RULED BY MICHAEL: "it should be
                  # front matter defined on any type: program to say like
                  # export: available to render a button." The automatic-with-
                  # opt-out alternative was overruled and correctly -- a program
                  # that should not be handed out is a real case, and silence is
                  # the safe default for a DISTRIBUTABLE artifact.
                  #
                  # ⚠️ A LIST OF KINDS RATHER THAN HIS FLOATED `available`, and
                  # the objection was mechanical rather than aesthetic. There are
                  # exactly two states -- there is a packet or there is not -- so
                  # a status WORD is a boolean in a status costume, and it invites
                  # `pending` / `soon` / `unavailable`, none of which anything
                  # would validate. It would also read as a second `status:` axis
                  # sitting inches away in the same block: two vocabularies for
                  # one idea, which is what retired three manifests here.
                  # `export: true` and a bare `export: packet` are BOTH accepted,
                  # because a truthy value that silently did nothing would be the
                  # dead-control shape this repo keeps finding.
                  #
                  # 🔴 THIS DECLARATION IS NOT THE CHECK, AND THAT IS WHY THE
                  # VALIDATION LIVES IN PYTHON. `objects._resolve` merges every
                  # type's `optional:` list and NOTHING EVER READS IT -- three
                  # fields (`revised`, `related`, `data`) were each found
                  # declared-and-unread that way. So an unknown kind is caught and
                  # REPORTED by `packet.kinds()`, never by this file. A typo like
                  # `export: pakcet` has to be a finding: nothing downstream can
                  # tell it from a program that simply has no packet, and both
                  # render as no button.
                  #
                  # 🚫 IT REQUIRES A LIVE `chain:` AND REFUSES TO GUESS ONE. A
                  # cover page with nothing behind it is a VALID document nobody
                  # would question, which is the worst artifact this feature could
                  # produce -- so no chain means no packet and a report saying so.
                  #
                  # 🔴 AND IT IS AN AGGREGATOR, SO IT IS A LEAK SURFACE. A member
                  # that is not `public` is refused and named: `nav: hidden` and
                  # `status: unlisted` are curtains for somebody BROWSING, and a
                  # packet is a PDF that leaves the site.
  - contents      # `false` draws nothing. `auto` opts IN from any other type.
                  # Inherited behaviour from the index renderer; a program
                  # folder's landing page is still an index, and a program is
                  # still allowed to list things.
  - links         # the `@url:` registry, page-local. Declared for the same
                  # reason it is used here: a program cites the outside
                  # authority it is founded on.
renders:
  - flow_strip: []
