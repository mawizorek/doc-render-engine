# Contacts, glossaries, revision histories: pages that are looked up rather
# than read.
#
# ⚠️ maintainer and updated_by were REMOVED 2026-08-03 with the rest of the
# spec-table fields. Who keeps a page current is worth stating on the page;
# it was not worth a key nothing read.

type: reference
label: Reference
extends: _base

# The tables a reference page may carry. Named after WHAT THEY ARE, so the same
# paragraph of prose reads correctly on the LX, audio and video copies of a page
# and only the filenames underneath change.
#
# ⚠️ ADD TO THIS LIST DELIBERATELY, not on demand. Every name here is a word an
# author has to guess correctly, and the value of a closed vocabulary is that
# the guess is always the same word. A page needing a table that is genuinely
# none of these is telling you something about the page.
data_slots:
  - schedule        # the tabular reference this page IS: a rack schedule, a
                    # patch, a channel hookup. The page's primary table.
  - survey          # what was found in the room, as opposed to what the
                    # schedule says should be there. The two disagreeing is
                    # the entire reason both exist as separate documents.
  - inventory_table # what a department owns.
  - revision_log    # what changed and when.
  - catalog         # the closed, numbered set of things this page DEFINES:
                    # every course the program offers, every role, every
                    # policy. Added 2026-08-04 for 02-courses.
                    #
                    # ⚠️ Not `schedule`, and the distinction is the reason this
                    # slot exists rather than reusing one. A schedule says what
                    # is happening or what is patched WHERE — it is true of one
                    # room, one show, one term, and it goes stale. A catalog
                    # says what EXISTS and what each entry MEANS. Nothing in it
                    # expires; entries are added and retired.
                    #
                    # ⚠️ Not `inventory_table` either: an inventory counts what
                    # is owned, and two of a thing are two rows. A catalog row
                    # is a DEFINITION, and there is exactly one of each.
