# A procedure: a thing somebody DOES, in an order, on some occasion.
#
# Distinct from `standard`, and the distinction is worth holding: a standard is
# what must be true, a procedure is what you do. The same subject often needs
# both, and collapsing them produces a document that is bad at being either.
#
# ⚠️ owner, frequency, trigger and systems were REMOVED 2026-08-03 with the
# rest of the spec-table fields. A procedure still needs a named owner -- one
# with no owner does not get done, it gets assumed -- but that belongs in a
# sentence somebody reads, not a key only the renderer saw.

type: procedure
label: Procedure
extends: _base
